  <text x="30" y="440" font-size="9" fill="#666">跑在：Candle + HomeAssistant · 数据出口：成品照 + G 代码存 NAS</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Denvi/Candle · home-assistant/core</text>
  <g transform="rotate(-8 296 108)">

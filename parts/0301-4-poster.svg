  <text x="180" y="196" text-anchor="middle" font-size="8.5" fill="#666">楼下有客？</text>
  <text x="286" y="236" text-anchor="middle" font-size="8.5" fill="#666">成品照</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">图纸出 G 代码 → 查木屋里人在不在休息 → Candle 探高开雕 → 完成拍照归档</text>

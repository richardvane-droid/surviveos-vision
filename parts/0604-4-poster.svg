    <rect x="228" y="130" width="94" height="66" rx="3" stroke-width="1.6"/>
    <path d="M228 140 h94 M228 186 h94" stroke-width="0.9"/>
    <path d="M234 132 h6 v5 h-6 Z M248 132 h6 v5 h-6 Z M262 132 h6 v5 h-6 Z M276 132 h6 v5 h-6 Z M290 132 h6 v5 h-6 Z M304 132 h6 v5 h-6 Z" stroke-width="0.7"/>
    <path d="M234 189 h6 v5 h-6 Z M248 189 h6 v5 h-6 Z M262 189 h6 v5 h-6 Z M276 189 h6 v5 h-6 Z M290 189 h6 v5 h-6 Z M304 189 h6 v5 h-6 Z" stroke-width="0.7"/>
    <path d="M266 152 l20 11 l-20 11 Z" stroke-width="1.4"/>

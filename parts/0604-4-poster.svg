    <path d="M70 140 l10 -6 M70 146 l12 0 M70 152 l10 6" stroke-width="0.6"/>
    <path d="M40 216 q10 -4 36 0" stroke-width="0.9"/>
    <path d="M44 216 q-4 -10 -2 -18 M50 216 q0 -12 4 -20 M68 216 q4 -10 2 -18" stroke-width="0.9"/>
    <!-- 中：一叠照片 + 时钟 -->
    <rect x="118" y="146" width="52" height="40" rx="2" stroke-width="1.1"/>
    <rect x="124" y="140" width="52" height="40" rx="2" stroke-width="1.2"/>
    <rect x="130" y="134" width="52" height="40" rx="2" stroke-width="1.5"/>
    <path d="M136 168 q6 -10 12 -6 q8 6 14 -4 q6 -8 14 -2" stroke-width="0.9"/>

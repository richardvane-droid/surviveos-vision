    <path d="M132 170 h48 v2 h-48 Z" fill="url(#p0604-4p-shade)" stroke="none"/>
    <circle cx="146" cy="204" r="11" stroke-width="1.3"/>
    <path d="M146 204 V196 M146 204 L152 207" stroke-width="1.4"/>
    <path d="M162 204 h6 M172 204 h6 M182 204 h6" stroke-width="0.8"/>
    <text x="196" y="207" font-size="8" fill="#3d3d3d" stroke="none">×8760</text>

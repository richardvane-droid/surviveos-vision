  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0604 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">草地延时合成</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">没人在意的时候，它也在长</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">整点快照 → 亮度筛选 → 季度末 FFmpeg 24fps → 一季浓缩一分钟</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每小时一张，一年 8,760 张自动按日期归档</text>
    <text x="64" y="366">太黑的夜间照片按亮度剔除，不进视频</text>
    <text x="64" y="396">一季一分钟，四段接起来就是草地的一整年</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA + 小主机 FFmpeg · 数据出口：NAS 视频 + 大屏缩略图</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：FFmpeg/FFmpeg</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0000-1-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0000-1-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0000-1-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <!-- 爆炸轴线（细虚线，贯穿所有零件） -->
  <path d="M96 318 L392 40" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4 4" fill="none"/>
  <g filter="url(#p0000-1-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92">
    <!-- ① 底座（最下） -->
    <ellipse cx="110" cy="300" rx="46" ry="16" stroke-width="1.5"/>
    <path d="M64 300 v14 a46 16 0 0 0 92 0 v-14" stroke-width="1.4"/>
    <path d="M66 306 a46 16 0 0 0 90 0" stroke-width="0.7"/>
    <path d="M70 312 a44 14 0 0 0 82 2 v-8 a44 14 0 0 1 -82 -2 Z" fill="url(#p0000-1-shade)" stroke="none"/>
    <path d="M110 284 v-4 M104 290 h12" stroke-width="0.9"/>
    <!-- ② 电机 + 齿轮 -->
    <rect x="150" y="214" width="46" height="30" rx="4" stroke-width="1.5"/>
    <rect x="152" y="216" width="42" height="26" rx="3" stroke-width="0.6"/>
    <path d="M152 236 h42 M160 216 v26 M176 216 v26" stroke-width="0.6"/>
    <rect x="152" y="230" width="42" height="12" fill="url(#p0000-1-shade)" stroke="none"/>
    <circle cx="212" cy="229" r="12" stroke-width="1.4"/>
    <circle cx="212" cy="229" r="4" stroke-width="1"/>
    <path d="M212 215 v-4 M212 243 v4 M198 229 h-4 M226 229 h4 M202 219 l-3 -3 M222 239 l3 3 M222 219 l3 -3 M202 239 l-3 3" stroke-width="1.6"/>
    <path d="M196 229 h4" stroke-width="1"/>
    <!-- ③ 主控板 -->
    <path d="M226 168 l64 -22 l30 14 l-64 22 Z" stroke-width="1.5"/>
    <path d="M228 170 l62 -21 l27 12" stroke-width="0.6"/>
    <path d="M244 166 l14 -5 l6 3 l-14 5 Z M262 158 l12 -4 l5 2 l-12 4 Z" stroke-width="1"/>
    <path d="M246 167 l14 -5 l6 3 l-14 5 Z" fill="url(#p0000-1-shade2)" stroke="none"/>
    <path d="M276 176 h3 M280 174 h3 M284 172 h3 M288 170 h3" stroke-width="1.2"/>
    <rect x="232" y="150" width="8" height="8" rx="1" stroke-width="0.9" transform="rotate(-19 236 154)"/>
    <!-- ④ 透镜 -->
    <ellipse cx="330" cy="104" rx="30" ry="12" stroke-width="1.5"/>
    <ellipse cx="330" cy="104" rx="20" ry="8" stroke-width="0.8"/>
    <ellipse cx="330" cy="104" rx="10" ry="4" stroke-width="0.8"/>
    <path d="M302 106 a30 12 0 0 0 56 0" stroke-width="0.8"/>
    <path d="M300 104 v6 a30 12 0 0 0 60 0 v-6" stroke-width="1.1"/>
    <path d="M304 108 a30 11 0 0 0 52 0 v4 a30 11 0 0 1 -52 0 Z" fill="url(#p0000-1-shade)" stroke="none"/>
    <!-- ⑤ 灯头（最上） -->
    <path d="M372 62 a20 8 0 0 1 40 0 v10 a20 8 0 0 1 -40 0 Z" stroke-width="1.5"/>
    <ellipse cx="392" cy="62" rx="20" ry="8" stroke-width="1.2"/>
    <path d="M378 48 q14 -20 28 0" stroke-width="1.3"/>
    <path d="M382 52 q10 -12 20 0" stroke-width="0.8"/>
    <path d="M374 66 a20 8 0 0 0 36 4 v3 a20 8 0 0 1 -36 -4 Z" fill="url(#p0000-1-shade)" stroke="none"/>
    <path d="M392 36 v-8 M380 40 l-5 -6 M404 40 l5 -6" stroke-width="1"/>
  </g>
  <!-- 引线 + 编号（不加滤镜，保持清晰） -->
  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M156 300 H206"/><path d="M196 229 H150"/><path d="M290 146 V118"/><path d="M360 104 H400"/><path d="M412 62 H440"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="216" cy="300" r="8"/><circle cx="140" cy="229" r="8"/><circle cx="290" cy="110" r="8"/><circle cx="410" cy="104" r="8"/><circle cx="450" cy="62" r="8"/>
    </g>
    <text x="216" y="303.5">1</text><text x="140" y="232.5">2</text><text x="290" y="113.5">3</text><text x="410" y="107.5">4</text><text x="450" y="65.5">5</text>
  </g>
  <!-- 图例 -->
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">模拟太阳灯头 · 爆炸图</text>
    <text x="16" y="52">1 铸铝底座（配重）</text>
    <text x="16" y="68">2 步进电机 + 减速齿轮</text>
    <text x="16" y="84">3 ESP32 主控板</text>
    <text x="16" y="100">4 菲涅尔透镜（调焦）</text>
    <text x="16" y="116">5 COB 灯头 + 散热罩</text>
  </g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0000-1</text>
</svg>

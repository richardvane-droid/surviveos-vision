    <path d="M154 160 Q120 150 96 130" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M208 164 Q236 158 262 150" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M154 190 Q120 210 98 234" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M208 190 Q240 214 274 232" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M100 134 l-4 -4 l5 -1 M258 152 l4 -2 l-1 5 M102 230 l-4 4 l5 1 M270 232 l4 0 l-2 4" stroke-width="1"/>
    <!-- 特性勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0204 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">设计模式一键</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">一个键，把卧室切成大脑</text>
  <g font-size="8.5" fill="#666" text-anchor="middle">
    <text x="74" y="152">台灯 2700K · 60%</text>
    <text x="292" y="166">三屏 WoL 唤醒</text>
    <text x="72" y="276">音箱设计歌单</text>
    <text x="292" y="276">假太阳降到 30%</text>
    <text x="180" y="222">短按进入 · 长按退出</text>
  </g>
  <text x="180" y="298" text-anchor="middle" font-size="9.5" fill="#666">按键短按 → HA 场景 → 台灯 / 三屏 / 歌单 / 阳光；长按退出</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">短按进入、长按 1.5 秒退出，同一个键</text>
    <text x="64" y="366">三屏靠网络唤醒包点亮，失败重试 3 次</text>
    <text x="64" y="396">订阅 0201 落日实体，台灯跟着一起暗</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HA scene · 数据出口：设计模式开关实体 / 唤醒失败推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：esphome/esphome · basnijholt/adaptive-lighting</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0204-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0204-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0204-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0204-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 中央大按键 -->
    <circle cx="180" cy="176" r="30" stroke-width="1.8"/>
    <circle cx="180" cy="176" r="21" stroke-width="1.1"/>
    <circle cx="180" cy="176" r="21" fill="url(#p0204-3p-dots)" stroke="none"/>
    <path d="M154 190 a30 30 0 0 0 52 0 v4 a30 30 0 0 1 -52 0 Z" fill="url(#p0204-3p-shade)" stroke="none"/>
    <path d="M180 166 v10 l6 4" stroke-width="1.3"/>
    <!-- 手指 -->
    <path d="M190 136 q4 -14 -2 -22 q-3 -4 -6 0 v18" stroke-width="1.2"/>
    <path d="M182 132 q-6 0 -6 6 v8" stroke-width="1"/>
    <!-- 左上：台灯 -->
    <path d="M60 116 l16 -22 h16 l-6 22 Z" stroke-width="1.4"/>
    <path d="M70 116 v22 M62 138 h16" stroke-width="1.3"/>
    <path d="M62 114 l24 0 v2 l-24 0 Z" fill="url(#p0204-3p-shade)" stroke="none"/>
    <path d="M64 124 l-4 6 M76 124 l0 8 M88 124 l4 6" stroke-width="0.7" stroke-dasharray="2 2"/>
    <!-- 右上：三屏 -->
    <rect x="252" y="116" width="22" height="30" rx="2" stroke-width="1.3"/>
    <rect x="278" y="112" width="34" height="34" rx="2" stroke-width="1.3"/>
    <rect x="316" y="116" width="18" height="30" rx="2" stroke-width="1.3"/>
    <path d="M254 142 h18 M280 142 h30 M318 142 h14" stroke-width="0.6"/>
    <path d="M292 146 v6 M284 152 h16" stroke-width="1"/>
    <!-- 左下：音箱 -->
    <rect x="54" y="220" width="30" height="42" rx="3" stroke-width="1.4"/>
    <circle cx="69" cy="232" r="5" stroke-width="1"/>
    <circle cx="69" cy="250" r="7" stroke-width="1"/>
    <circle cx="69" cy="250" r="2" stroke-width="0.8"/>
    <path d="M90 236 a10 10 0 0 1 0 14 M96 230 a18 18 0 0 1 0 26" stroke-width="0.9"/>
    <!-- 右下：假太阳 30% -->
    <circle cx="292" cy="240" r="12" stroke-width="1.4"/>
    <circle cx="292" cy="240" r="12" fill="url(#p0204-3p-shade)" stroke="none"/>
    <path d="M292 222 v-5 M292 258 v5 M274 240 h-5 M310 240 h5 M279 227 l-3 -3 M305 253 l3 3 M305 227 l3 -3 M279 253 l-3 3" stroke-width="1" stroke-dasharray="2 2"/>

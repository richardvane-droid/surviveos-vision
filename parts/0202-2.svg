    <path d="M283 142 l8 -3 v-44 l-8 3 Z" stroke-width="1.3"/>
    <path d="M335 120 l8 -3 v-44 l-8 3 Z" stroke-width="1.3"/>
    <path d="M283 98 l60 -26 v-8 l-60 26 Z" stroke-width="1.3"/>
    <path d="M284 141 l6 -2 v-42 l-6 2 Z M336 119 l6 -2 v-42 l-6 2 Z" fill="url(#p0202-2-shade)" stroke="none"/>
    <path d="M286 130 l3 -12 M288 120 l2 -8 M338 108 l3 -12 M300 90 l6 -8 M320 82 l6 -8" stroke-width="0.6"/>
    <!-- ⑤ 镜前灯带（藏在夹角） -->
    <path d="M348 78 l50 -22 v-6 l-50 22 Z" stroke-width="1.3"/>
    <path d="M352 74 h1 M358 71 h1 M364 68 h1 M370 66 h1 M376 63 h1 M382 60 h1 M388 58 h1 M394 55 h1" stroke-width="1.6"/>
    <path d="M348 78 v4 q6 6 12 2" stroke-width="0.8"/>
    <path d="M349 77 l48 -21 v2 l-48 21 Z" fill="url(#p0202-2-shade)" stroke="none"/>
  </g>
  <!-- 引线 + 编号 -->
  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M78 290 H50"/><path d="M204 236 H240"/><path d="M276 172 H320"/><path d="M343 100 H400"/><path d="M398 58 H440"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="40" cy="290" r="8"/><circle cx="250" cy="236" r="8"/><circle cx="330" cy="172" r="8"/><circle cx="410" cy="100" r="8"/><circle cx="450" cy="58" r="8"/>
    </g>
    <text x="40" y="293.5">1</text><text x="250" y="239.5">2</text><text x="330" y="175.5">3</text><text x="410" y="103.5">4</text><text x="450" y="61.5">5</text>
  </g>
  <!-- 图例 -->
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">六面镜光箱 · 爆炸图</text>
    <text x="16" y="52">1 防潮基板 + 卡扣（防霉胶收边）</text>
    <text x="16" y="68">2 电热除雾膜 40W</text>
    <text x="16" y="84">3 主镜 900×700 银镜 5mm</text>
    <text x="16" y="100">4 两侧壁镜 + 顶面镜（无影光）</text>
    <text x="16" y="116">5 镜前双色温灯带（藏夹角）</text>
  </g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0202-2</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0202-2-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0202-2-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0202-2-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <!-- 爆炸轴线 -->
  <path d="M96 318 L392 40" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4 4" fill="none"/>
  <g filter="url(#p0202-2-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92">
    <!-- ① 防潮基板（立板，带卡扣） -->
    <path d="M80 322 l60 -26 v-50 l-60 26 Z" stroke-width="1.5"/>
    <path d="M80 322 l-5 -2 v-50 l5 2 M75 320 l60 -26 l5 2" stroke-width="1.2"/>
    <path d="M75 270 l60 -26 v50 l-60 26 Z" stroke="none" fill="none"/>
    <path d="M76 320 l58 -25 v3 l-58 25 Z M76 269 v50 l3 1 v-50 Z" fill="url(#p0202-2-shade)" stroke="none"/>
    <path d="M84 300 l4 -2 v4 l-4 2 Z M130 280 l4 -2 v4 l-4 2 Z M84 316 l4 -2 v4 l-4 2 Z M130 296 l4 -2 v4 l-4 2 Z" stroke-width="0.9"/>
    <path d="M86 310 l48 -21 M86 288 l48 -21" stroke-width="0.5" stroke-dasharray="2 2"/>
    <!-- ② 电热除雾膜（蛇形电热丝） -->
    <path d="M152 258 l52 -22 v-40 l-52 22 Z" stroke-width="1.3"/>
    <path d="M158 250 l40 -17 M158 242 l40 -17 M158 234 l40 -17 M158 226 l40 -17" stroke-width="0.7"/>
    <path d="M198 233 v-8 M158 242 v-8 M198 217 v-8" stroke-width="0.7"/>
    <path d="M162 258 v7 M167 256 v7" stroke-width="0.9"/>
    <path d="M153 257 l50 -21 v2 l-50 21 Z" fill="url(#p0202-2-shade)" stroke="none"/>

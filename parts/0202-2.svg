    <path d="M212 202 l64 -28 v-50 l-64 28 Z" stroke-width="1.5"/>
    <path d="M212 202 v4 l64 -28 v-4" stroke-width="1.1"/>
    <path d="M213 203 l62 -27 v3 l-62 27 Z" fill="url(#p0202-2-shade2)" stroke="none"/>
    <path d="M226 186 l22 -32 M234 190 l24 -34 M258 172 l10 -14" stroke-width="0.6"/>
    <path d="M214 200 l60 -26" stroke-width="0.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0703-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0703-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0703-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0703-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 左：太阳 + 光伏板 -->
    <circle cx="62" cy="126" r="11" stroke-width="1.4"/>
    <path d="M62 110 v-5 M62 142 v5 M46 126 h-5 M78 126 h5 M51 115 l-4 -4 M73 137 l4 4 M73 115 l4 -4 M51 137 l-4 4" stroke-width="1.1"/>
    <path d="M46 176 l60 -22 l16 8 l-60 22 Z" stroke-width="1.5"/>
    <path d="M56 174 l16 8 M66 170 l16 8 M76 166 l16 8 M86 162 l16 8" stroke-width="0.7"/>
    <path d="M48 178 l14 7 v3 l-14 -7 Z" fill="url(#p0703-4p-shade)" stroke="none"/>
    <path d="M78 184 v14 M72 198 h12" stroke-width="1.2"/>
    <!-- 中：电池 + 电量 -->
    <rect x="150" y="128" width="60" height="70" rx="5" stroke-width="1.5"/>
    <path d="M170 128 v-7 h20 v7" stroke-width="1.3"/>
    <rect x="156" y="150" width="48" height="42" rx="2" stroke-width="0.6"/>
    <path d="M157 172 h46 v19 h-46 Z" fill="url(#p0703-4p-dots)" stroke="none"/>
    <path d="M156 164 h48" stroke-width="0.6" stroke-dasharray="2 2"/>
    <!-- 右：马灯 + 月亮 -->
    <path d="M232 108 a12 12 0 1 0 8 20 a10 10 0 0 1 -8 -20 Z" stroke-width="1.2"/>
    <path d="M262 150 q-6 -22 8 -24 q14 2 8 24" stroke-width="1.4"/>
    <path d="M258 150 a12 4 0 0 0 24 0" stroke-width="1.2"/>
    <path d="M256 150 v6 q0 10 14 10 q14 0 14 -10 v-6" stroke-width="1.4"/>
    <path d="M258 156 q0 8 12 8 q12 0 12 -8 v-3 a12 4 0 0 1 -24 0 Z" fill="url(#p0703-4p-shade)" stroke="none"/>
    <path d="M262 126 q8 -26 16 0" stroke-width="1.3"/>
    <path d="M270 112 v-6" stroke-width="1"/>
    <path d="M248 176 l6 -6 M292 176 l-6 -6 M270 184 v-8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <path d="M232 196 h76" stroke-width="1.2"/>
    <!-- 箭头 -->
    <path d="M114 166 Q130 160 144 160" stroke-width="1" stroke-dasharray="3 3"/><path d="M140 156 l5 4 l-5 4" stroke-width="1"/>
    <path d="M214 160 Q230 160 246 160" stroke-width="1" stroke-dasharray="3 3"/><path d="M242 156 l5 4 l-5 4" stroke-width="1"/>
    <!-- 地平 -->
    <path d="M40 258 Q180 250 320 258" stroke-width="1.2"/>
    <path d="M44 262 q40 -3 80 0 M236 262 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0703 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">光伏电量看护</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">天黑自己亮，没电自己省，钓台的电自己管</text>
  <text x="180" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#2a2a2a">82%</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">MPPT / BMS → ESPHome → HA sun + 电量阈值 → 亮灯 / 分级断电 / 推送</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">日落自动把马灯点到 30%，地脚灯一起亮</text>
    <text x="64" y="366">电量 20% 关逆变器，10% 只留监测，天亮再补回</text>
    <text x="64" y="396">冬天电芯低于 0℃ 禁止充电，电池多活几年</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HomeAssistant · 数据出口：大屏电量卡片 + 手机推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：KinDR007/VictronMPPT-ESPHOME · Bettapro/Solar-Tracer</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0502-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0502-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0502-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0502-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 左：太阳能板 + ESP32 防水盒 -->
    <path d="M42 170 l44 -18 l16 10 l-44 18 Z" stroke-width="1.6"/>
    <path d="M52 172 l44 -18 M62 178 l44 -18 M56 164 l16 10 M70 158 l16 10" stroke-width="0.6"/>
    <path d="M44 171 l42 -17 l14 9 l-42 17 Z" fill="url(#p0502-3p-dots)" stroke="none"/>
    <path d="M70 180 v10" stroke-width="1.2"/>
    <rect x="50" y="190" width="40" height="24" rx="3" stroke-width="1.4"/>
    <path d="M52 206 h36 v6 h-36 Z" fill="url(#p0502-3p-shade)" stroke="none"/>
    <path d="M58 198 h8 M70 198 h12" stroke-width="0.8"/>
    <path d="M90 196 q8 -2 8 -10" stroke-width="1"/>
    <!-- 中：土壤探针 + 水滴 -->
    <path d="M136 222 q44 -34 88 0" stroke-width="1.6"/>
    <path d="M140 222 q40 -28 80 0 v4 q-40 -22 -80 0 Z" fill="url(#p0502-3p-shade)" stroke="none"/>
    <rect x="175" y="150" width="10" height="44" rx="2" stroke-width="1.4"/>
    <path d="M177 194 v18 M183 194 v18" stroke-width="1.6"/>
    <path d="M177 158 h6 M177 166 h6" stroke-width="0.7"/>
    <path d="M180 116 q-8 11 -8 17 a8 8 0 0 0 16 0 q0 -6 -8 -17 Z" stroke-width="1.4"/>
    <path d="M175 133 a5 5 0 0 0 4 4" stroke-width="0.7"/>
    <!-- 右：水泵 + 滴灌带 + 幼苗 -->
    <circle cx="270" cy="182" r="15" stroke-width="1.6"/>
    <circle cx="270" cy="182" r="4" stroke-width="1"/>
    <path d="M270 168 q6 8 0 14 M256 182 q8 -6 14 0 M270 196 q-6 -8 0 -14 M284 182 q-8 6 -14 0" stroke-width="0.9"/>
    <path d="M285 182 h14 q6 0 6 6 v22" stroke-width="1.4"/>
    <path d="M305 214 h18" stroke-width="1.4"/>
    <path d="M300 220 q-2 4 0 6 q2 -2 0 -6 Z M310 222 q-2 4 0 6 q2 -2 0 -6 Z M320 220 q-2 4 0 6 q2 -2 0 -6 Z" stroke-width="0.9"/>
    <path d="M312 244 q0 -14 4 -20 M316 236 q6 -6 10 -4 q-2 6 -10 6 M314 230 q-6 -6 -10 -4 q2 6 10 6" stroke-width="1.1"/>
    <path d="M300 246 h30" stroke-width="1"/>
    <!-- 箭头 -->
    <path d="M100 190 Q124 186 146 180" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M214 178 Q232 176 250 178" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M142 176 l5 4 l-5 4 M246 174 l5 4 l-5 4" stroke-width="1"/>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0502 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">墙脚滴灌器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">头两年根还浅，太阳能小泵替你守着墙根</text>
  <text x="70" y="230" text-anchor="middle" font-size="8.5" fill="#666">太阳能 + ESP32</text>
  <text x="180" y="244" text-anchor="middle" font-size="8.5" fill="#666">土壤湿度 &lt;35%</text>
  <text x="270" y="210" text-anchor="middle" font-size="8.5" fill="#666">开泵 90 秒</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">土壤探头 → 阈值 + 今日次数 + 天气 → 水泵 90 秒</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每小时醒一次，低于 35% 且今天没浇才开泵</text>
    <text x="64" y="366">雨天跳过，每天最多浇两次，不怕烂根</text>
    <text x="64" y="396">浇了三次湿度不涨，判断罐空或管断并推送</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome（ESP32 本地） · 数据出口：HA 湿度曲线 + 浇水记录</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Lumics/Plantwatery</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

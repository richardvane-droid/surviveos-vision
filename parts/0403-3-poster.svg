    <rect x="156" y="132" width="48" height="32" rx="3" stroke-width="1.4"/>
    <rect x="161" y="137" width="38" height="22" rx="2" stroke-width="0.7"/>
    <path d="M162 132.0 v-5 M162 164.0 v5 M170 132.0 v-5 M170 164.0 v5 M178 132.0 v-5 M178 164.0 v5 M186 132.0 v-5 M186 164.0 v5 M194 132.0 v-5 M194 164.0 v5 " stroke-width="1"/>
    <rect x="161" y="153" width="38" height="6" fill="url(#p0403-3p-shade)" stroke="none"/>
    <circle cx="180" cy="204" r="18" stroke-width="1.4"/>
    <path d="M180 204 V190 M180 204 L190 210" stroke-width="1.6"/>
    <path d="M180 188 v3 M180 220 v-3 M164 204 h3 M196 204 h-3" stroke-width="1"/>
    <path d="M180 190 a14 14 0 0 1 12 20" stroke-width="2.4" stroke-opacity="0.5"/>

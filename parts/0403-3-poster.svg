  <text x="50" y="204" font-size="8" fill="#666">门磁</text><text x="196" y="236" font-size="8" fill="#666">30 分钟倒计时</text><text x="296" y="214" font-size="8" fill="#666">风机 · 橙灯</text>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0403 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">排风联锁</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">门一开风就走，门关了风再多走三十分钟</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">门磁 → ESP32 本地联锁 → 风机 + 橙灯 → 关门延时 30 分钟停</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">门开即启动风机和橙灯，想忘都忘不掉</text>
    <text x="64" y="366">关门延时 30 分钟，漆雾排干净再停</text>
    <text x="64" y="396">ESP32 本地执行，断网照常联锁</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome（ESP32 本地）· 数据出口：HA 剩余时间 + 手机加时</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：patrickcollins12/esphome-fan-controller</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0210-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0210-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0210-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0210-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 罐头（左）带条码 -->
    <ellipse cx="72" cy="168" rx="22" ry="8" stroke-width="1.6"/>
    <path d="M50 168 v48 a22 8 0 0 0 44 0 v-48" stroke-width="1.6"/>
    <path d="M52 172 a22 8 0 0 0 40 0" stroke-width="0.7"/>
    <path d="M58 186 v18 M61 186 v18 M65 186 v18 M67 186 v18 M71 186 v18 M75 186 v18 M77 186 v18 M81 186 v18 M85 186 v18" stroke-width="0.9"/>
    <path d="M52 210 a22 8 0 0 0 40 0 v6 a22 8 0 0 1 -40 0 Z" fill="url(#p0210-3p-shade)" stroke="none"/>
    <!-- 日历（中上） -->
    <rect x="140" y="120" width="80" height="70" rx="4" stroke-width="1.6"/>
    <path d="M140 136 H220" stroke-width="1.2"/>
    <path d="M156 114 v10 M204 114 v10" stroke-width="1.4"/>
    <path d="M142 122 h76 v14 h-76 Z" fill="url(#p0210-3p-shade)" stroke="none"/>
    <path d="M160 136 V190 M180 136 V190 M200 136 V190 M140 154 H220 M140 172 H220" stroke-width="0.6"/>
    <circle cx="190" cy="181" r="7" stroke-width="1.3"/>
    <path d="M148 146 h6 M168 146 h6 M188 146 h6 M208 146 h6 M148 164 h6 M168 164 h6 M188 164 h6 M208 164 h6 M148 182 h6 M168 182 h6" stroke-width="0.7"/>
    <!-- 小白板（右）+ 铃铛 -->
    <rect x="248" y="150" width="72" height="56" rx="3" stroke-width="1.6"/>
    <rect x="252" y="154" width="64" height="48" rx="2" stroke-width="0.6"/>
    <path d="M258 196 h30" stroke-width="0.8"/>
    <path d="M248 206 h72 v4 h-72 Z" fill="url(#p0210-3p-shade)" stroke="none"/>
    <path d="M296 134 v-10 a8 8 0 0 1 16 0 v10 l4 4 h-24 Z" stroke-width="1.2"/>
    <path d="M301 138 a3 3 0 0 0 6 0" stroke-width="1"/>
    <path d="M288 124 l-4 -4 M320 124 l4 -4" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M98 176 Q118 160 136 152" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M224 160 Q234 166 244 172" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 货架线 -->
    <path d="M40 240 Q180 232 320 240" stroke-width="1.2"/>
    <path d="M56 246 q30 -3 60 0 M244 246 q30 -3 60 0" stroke-width="0.6"/>
    <!-- 滚动小罐头（架子上） -->
    <circle cx="140" cy="228" r="7" stroke-width="1"/><circle cx="158" cy="228" r="7" stroke-width="1"/><circle cx="176" cy="228" r="7" stroke-width="1"/>
    <circle cx="176" cy="228" r="7" fill="url(#p0210-3p-dots)" stroke="none"/>
    <path d="M196 228 h18" stroke-width="0.9" stroke-dasharray="2 2"/><path d="M211 225 l4 3 l-4 3" stroke-width="0.9"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0210 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">到期提醒器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">先进先出是架子的事，到期前吱一声是它的事</text>
  <text x="190" y="184.5" text-anchor="middle" font-size="8" fill="#2a2a2a" font-weight="700">30</text>
  <text x="284" y="176" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#2a2a2a">库存 92 天</text>
  <text x="284" y="190" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="9" fill="#b5372b">3 罐将到期</text>
  <text x="180" y="270" text-anchor="middle" font-size="9.5" fill="#666">扫码 / NFC 出入库 → Grocy 到期排序 → 30 天标黄 · 7 天标红</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每天早上 8 点拉一次到期列表</text>
    <text x="64" y="366">30 天内提醒标黄，7 天内标红推手机</text>
    <text x="64" y="396">忘了扫码也没事，月底盘点对一遍实物</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：Grocy + HA · 数据出口：sensor.grocy_expiring + 大屏到期卡片</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：grocy/grocy · custom-components/grocy</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

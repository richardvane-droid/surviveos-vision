<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0105-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="10" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0105-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0105-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0105-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 合上的 PSK 盒 -->
    <rect x="40" y="160" width="56" height="34" rx="3" stroke-width="1.6"/>
    <path d="M40 170 h56" stroke-width="1"/><path d="M62 165 h12" stroke-width="1.2"/>
    <path d="M42 184 h52 v8 h-52 Z" fill="url(#p0105-4p-shade)" stroke="none"/>
    <path d="M98 150 l4 -6 M104 154 l6 -3" stroke-width="0.9"/>
    <!-- 27 格零件柜 -->
    <rect x="128" y="132" width="108" height="54" stroke-width="1.5"/>
    <path d="M128 150 h108 M128 168 h108" stroke-width="0.8"/>
    <path d="M140 132 v54 M152 132 v54 M164 132 v54 M176 132 v54 M188 132 v54 M200 132 v54 M212 132 v54 M224 132 v54" stroke-width="0.8"/>
    <rect x="164" y="150" width="12" height="18" fill="url(#p0105-4p-shade)" stroke="none"/>
    <rect x="212" y="168" width="12" height="18" fill="url(#p0105-4p-shade)" stroke="none"/>
    <circle cx="170" cy="192" r="2.5" stroke-width="1"/><circle cx="218" cy="192" r="2.5" stroke-width="1"/>
    <path d="M166 200 l-3 4 M174 200 l3 4 M214 200 l-3 4 M222 200 l3 4" stroke-width="0.7"/>
    <!-- 采购清单 -->
    <path d="M266 130 h54 v70 h-54 Z" stroke-width="1.5"/>
    <path d="M274 128 v-6 M312 128 v-6" stroke-width="1"/>
    <rect x="272" y="142" width="7" height="7" stroke-width="0.9"/><path d="M282 147 h30" stroke-width="0.8"/>
    <rect x="272" y="158" width="7" height="7" stroke-width="0.9"/><path d="M282 163 h30" stroke-width="0.8"/>
    <rect x="272" y="174" width="7" height="7" stroke-width="0.9"/><path d="M282 179 h22" stroke-width="0.8"/>
    <path d="M273 160 l2 3 l4 -5" stroke-width="1"/>
    <!-- 台面线 -->
    <path d="M40 232 Q180 226 320 232" stroke-width="1.2"/>
    <path d="M56 236 q40 -3 80 0 M230 236 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 箭头 -->
    <path d="M100 176 H122" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M240 160 H262" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0105 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">耗材库存提醒</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">合上一只盒子，27 个格子自己记账</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">合盖 → InvenTree 组装单扣库存 → 低于 14 天用量 → 采购清单 + 格口灯</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每合一次盖，27 种零件库存同时减一</text>
    <text x="64" y="366">按最近 30 天日均消耗算，低于两周用量就提醒</text>
    <text x="64" y="396">每周日盘点校正，系统和格子永远对得上</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：InvenTree + HomeAssistant · 数据出口：库存 API + 采购清单推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：inventree/InvenTree</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

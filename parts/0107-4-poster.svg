    <rect x="146" y="120" width="68" height="92" rx="6" stroke-width="1.6"/>
    <rect x="152" y="128" width="56" height="74" rx="2" stroke-width="0.7"/>
    <circle cx="160" cy="142" r="4" stroke-width="1"/><path d="M158 142 l1.5 1.5 l3 -3.5" stroke-width="1"/>

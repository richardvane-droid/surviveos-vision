  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0107 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">吧台点单账本</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">问一句手冲还是热红酒，架子上有什么它比我清楚</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">8 只罐子登记库存 → 按库存筛配方 → 点单扣用量 → 缺料进购物清单</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">只列今晚做得出来的，不会答应了才发现没桂花</text>
    <text x="64" y="366">每杯按配方克数扣库存，罐子空前一周就知道</text>
    <text x="64" y="396">购物清单直接推到手机，赶集顺手买齐</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：Bar Assistant（自托管） · 数据出口：库存 API + 购物清单推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：karlomikus/bar-assistant</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

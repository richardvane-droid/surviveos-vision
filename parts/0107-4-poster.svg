    <rect x="94" y="168" width="20" height="32" rx="3" stroke-width="1.4"/><rect x="97" y="160" width="14" height="8" rx="1.5" stroke-width="1.1"/>
    <rect x="45" y="184" width="14" height="13" fill="url(#p0107-4p-dots)" stroke="none"/>
    <rect x="71" y="178" width="14" height="19" fill="url(#p0107-4p-dots)" stroke="none"/>
    <rect x="97" y="190" width="14" height="7" fill="url(#p0107-4p-dots)" stroke="none"/>
    <path d="M46 178 h12 M72 178 h12 M98 178 h12" stroke-width="0.6"/>

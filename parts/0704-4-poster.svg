  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">煮茶烤鱼计时器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">聊天归聊天，鱼熟了水开了它会喊你</text>
  <text x="283" y="180" text-anchor="middle" font-size="6.5" fill="#b5372b" font-weight="700">2:00</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">鱼肉探针 + 壶壁探针 → WLANThermo 阈值推送 → HA 泡茶倒计时</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">鱼心 63℃ 提醒翻面，70℃ 提醒出锅</text>
    <text x="64" y="366">壶壁 95℃ 报水开，龙井 2 分钟、普洱 20 秒倒计时</text>
    <text x="64" y="396">探针拔出或 30 分钟没变化，提醒去看一眼火</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESP32 WLANThermo + HA · 数据出口：手机推送 + 柱上小屏</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：WLANThermo-nano/WLANThermo_ESP32_Software</text>

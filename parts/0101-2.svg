  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">掠射射灯与放大压片 · 爆炸图</text>
  <g font-size="8.5" fill="#444"><text x="16" y="46">1 梁底可旋转安装座（350°）</text><text x="16" y="59">2 恒流驱动器 · 0-10V 调光，2 秒渐亮渐暗</text><text x="16" y="72">3 俯仰云台关节 ±45°：把入射角压到 15~25° 掠射</text><text x="16" y="85">4 COB 灯体 3000K · Ra≥95 · 12W + 散热鳍</text><text x="16" y="98">5 蜂窝防眩罩 · 15° 窄光束</text><text x="16" y="111">6 毫米波存在传感器小板</text><text x="16" y="124">7 可翻三倍放大压片，翻下时距卡面约 25mm</text></g>

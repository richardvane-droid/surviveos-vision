  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0403 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">VOC 监测告警</text>

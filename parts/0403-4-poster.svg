    <text x="64" y="396">按天画曲线，看得出哪种漆最毒</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HomeAssistant · 数据出口：手机推送 + 0802 中枢屏</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：MallocArray/airgradient_esphome</text>
  <g transform="rotate(-8 296 108)">

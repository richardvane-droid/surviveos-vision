<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0212-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0212-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0212-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0212-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：按键板（左） → 计数卡片（中上） → 周进度表（右） -->
    <!-- 按键板 -->
    <rect x="46" y="178" width="48" height="54" rx="4" stroke-width="1.6"/>
    <circle cx="70" cy="200" r="12" stroke-width="1.5"/>
    <circle cx="70" cy="200" r="8" stroke-width="0.8"/>
    <circle cx="70" cy="200" r="8" fill="url(#p0212-4p-dots)" stroke="none"/>
    <circle cx="86" cy="186" r="2.5" stroke-width="1"/>
    <path d="M86 180 v-2 M90 182 l2 -2" stroke-width="0.7"/>
    <rect x="54" y="218" width="32" height="8" rx="1" stroke-width="1"/>
    <path d="M58 220 v4 M66 220 v4 M74 220 v4 M82 220 v4" stroke-width="1.2"/>
    <path d="M56 219 h6 v3 h-6 Z M72 219 h6 v3 h-6 Z" fill="url(#p0212-4p-shade)" stroke="none"/>
    <path d="M70 232 v14 q0 4 4 4 h6" stroke-width="0.9"/>
    <!-- 计数卡片 -->
    <path d="M156 116 h40 l8 8 v40 h-48 Z" stroke-width="1.6"/>
    <path d="M196 116 v8 h8" stroke-width="1"/>
    <path d="M166 128 v14 M172 128 v14 M178 128 v14 M184 128 v14 M162 143 l26 -14" stroke-width="1.4"/>
    <path d="M166 150 v10 M172 150 v10 M178 150 v10" stroke-width="1.4"/>
    <path d="M158 160 h44 v2 h-44 Z" fill="url(#p0212-4p-shade)" stroke="none"/>
    <!-- 周进度表 -->
    <rect x="244" y="178" width="84" height="56" rx="3" stroke-width="1.6"/>
    <path d="M244 192 h84" stroke-width="0.9"/>
    <path d="M260.8 178 v40 M277.6 178 v40 M294.4 178 v40 M311.2 178 v40 M244 218 h84" stroke-width="0.6"/>
    <path d="M248 183 h8 M265 183 h8 M282 183 h8 M299 183 h8 M316 183 h8" stroke-width="0.6"/>
    <path d="M248 205 l4 4 l6 -9 M265 205 l4 4 l6 -9 M282 205 l4 4 l6 -9 M299 205 l4 4 l6 -9" stroke-width="1.3"/>
    <rect x="250" y="222" width="72" height="6" rx="1" stroke-width="0.8"/>
    <path d="M251 223 h56 v4 h-56 Z" fill="url(#p0212-4p-shade)" stroke="none"/>
    <!-- 箭头：按键板 → 卡片 → 周表 -->
    <path d="M100 186 Q126 160 152 142" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M206 142 Q226 160 244 190" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地面线 -->
    <path d="M40 268 Q180 262 320 268" stroke-width="1.2"/>
    <path d="M44 272 q40 -3 80 0 M236 272 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0212 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">训练组数计数</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">每按一下，白板上那个勾就离你更近一格</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">按键板 → HA counter → wger 训练日志 → 周汇总 → 大屏</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">单击 +1 组，长按切动作，重量从拨码开关读</text>
    <text x="64" y="366">组数达标小灯亮绿，只做一半的日子不算勾</text>
    <text x="64" y="396">按键板离线用 Flexify 手机补记，周末自动汇总</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HA · 数据出口：wger 日志 + sensor.week_progress</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：wger-project/wger · brandonp2412/Flexify</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0105-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0105-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0105-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0105-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 台边按钮 -->
    <circle cx="66" cy="180" r="18" stroke-width="1.6"/><circle cx="66" cy="180" r="10" stroke-width="1"/>
    <circle cx="66" cy="180" r="10" fill="url(#p0105-3p-dots)" stroke="none"/>
    <path d="M48 184 v8 a18 6 0 0 0 36 0 v-8" stroke-width="1.2"/>
    <!-- 长条灯 + 摄像头 -->
    <rect x="120" y="110" width="120" height="9" rx="2" stroke-width="1.4"/>
    <path d="M126 126 l-4 10 M150 126 l-2 10 M180 126 v10 M210 126 l2 10 M234 126 l4 10" stroke-width="0.7" stroke-dasharray="2 2"/>
    <rect x="164" y="140" width="32" height="20" rx="3" stroke-width="1.5"/>
    <circle cx="180" cy="168" r="6" stroke-width="1.3"/><circle cx="180" cy="168" r="2.5" stroke-width="0.9"/>
    <path d="M172 176 l-14 44 M188 176 l14 44" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- 皮垫 + 打开的盒身 -->
    <rect x="128" y="218" width="104" height="34" rx="3" stroke-width="1.3"/>
    <rect x="132" y="222" width="96" height="26" fill="url(#p0105-3p-shade)" stroke="none"/>
    <rect x="160" y="228" width="26" height="16" rx="2" stroke-width="1.3" fill="#f7f4ee"/>
    <path d="M186 228 l16 -10 v16 l-16 10" stroke-width="1.2"/>
    <!-- NAS + 手机 -->
    <rect x="268" y="150" width="54" height="44" rx="3" stroke-width="1.5"/>
    <path d="M274 160 h42 M274 170 h42 M274 180 h42" stroke-width="0.8"/>
    <circle cx="312" cy="160" r="1.5" stroke-width="0.8"/><circle cx="312" cy="170" r="1.5" stroke-width="0.8"/><circle cx="312" cy="180" r="1.5" stroke-width="0.8"/>
    <rect x="280" y="208" width="26" height="44" rx="4" stroke-width="1.3"/>
    <path d="M287 218 h12 M287 226 h12" stroke-width="0.7"/><circle cx="293" cy="246" r="2" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M86 176 Q120 150 160 150" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M198 150 Q230 150 264 168" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M295 196 v8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0105 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">一键录制组装</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">坐下按一下，这只盒子的出生过程自动成片</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">台边按钮 → 灯 100% + Frigate 手动事件 → 合盖自动停录 → NAS + 手机</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">一个按钮同时开灯、开录，坐下就是开机</text>
    <text x="64" y="366">合盖磁簧一断就停录，不会录出两小时空台面</text>
    <text x="64" y="396">视频按日期和盒号命名，直接进剪辑素材库</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant + Frigate · 数据出口：NAS 视频文件 + 手机推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：blakeblackshear/frigate</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

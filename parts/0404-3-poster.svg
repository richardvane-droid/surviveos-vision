  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome（ESP32 本地）· 数据出口：HA 集尘器状态 + 倒桶提醒</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：FoxDotBuild/DustCollection</text>

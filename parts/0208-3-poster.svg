<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0208-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="35" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0208-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0208-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <!-- 海报边框（双线，手绘） -->
  <g filter="url(#p0208-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：按钮 → 灯下的唱盘 → 音箱 -->
    <!-- 墙上的听音按钮（左） -->
    <rect x="44" y="140" width="48" height="48" rx="4" stroke-width="1.5"/>
    <circle cx="68" cy="164" r="13" stroke-width="1.5"/>
    <circle cx="68" cy="164" r="8" stroke-width="0.9"/>
    <circle cx="68" cy="164" r="8" fill="url(#p0208-3p-dots)" stroke="none"/>
    <path d="M48 180 h40 v5 h-40 Z" fill="url(#p0208-3p-shade)" stroke="none"/>
    <path d="M50 146 l3 3 M86 146 l-3 3" stroke-width="0.7"/>
    <!-- 顶灯 + 光锥（中） -->
    <path d="M170 108 h20 l6 9 h-32 Z" stroke-width="1.3"/>
    <path d="M180 108 v-6" stroke-width="1"/>
    <path d="M172 118 L136 152 M188 118 L224 152" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- 唱盘（俯视） -->
    <rect x="132" y="150" width="96" height="66" rx="3" stroke-width="1.5"/>
    <circle cx="166" cy="183" r="24" stroke-width="1.4"/>
    <circle cx="166" cy="183" r="16" stroke-width="0.6"/>
    <circle cx="166" cy="183" r="8" stroke-width="0.8"/>
    <circle cx="166" cy="183" r="2" stroke-width="1"/>
    <path d="M142 183 a24 24 0 0 0 24 24 v-4 a20 20 0 0 1 -20 -20 Z" fill="url(#p0208-3p-shade)" stroke="none"/>
    <circle cx="210" cy="164" r="5" stroke-width="1.2"/>
    <path d="M207 168 L184 196" stroke-width="1.8"/>
    <path d="M184 196 l-5 3 l2 3 l5 -3 Z" stroke-width="0.9"/>
    <path d="M212 160 l4 -5" stroke-width="1.6"/>
    <!-- 落地音箱（右） -->
    <rect x="270" y="132" width="42" height="94" rx="3" stroke-width="1.5"/>
    <circle cx="291" cy="200" r="13" stroke-width="1.3"/>
    <circle cx="291" cy="200" r="5" stroke-width="0.7"/>
    <circle cx="291" cy="168" r="8" stroke-width="1.1"/>
    <circle cx="291" cy="148" r="4" stroke-width="0.9"/>
    <path d="M278 200 a13 13 0 0 0 13 13 v-3 a10 10 0 0 1 -10 -10 Z" fill="url(#p0208-3p-shade)" stroke="none"/>
    <path d="M274 216 h34 v6 h-34 Z" fill="url(#p0208-3p-shade)" stroke="none"/>
    <path d="M260 172 q-8 14 0 28 M250 164 q-12 22 0 44" stroke-width="0.9"/>
    <!-- 箭头：按钮 → 唱盘 → 音箱 -->
    <path d="M96 164 Q112 164 128 176" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M232 190 Q250 196 266 210" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地面线 -->
    <path d="M40 240 Q180 232 320 240" stroke-width="1.2"/>
    <path d="M44 244 q40 -3 80 0 M236 244 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性行勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <!-- 底部信息条 -->
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <!-- 文字层（不加滤镜） -->
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0208 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">听音场景</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">一个按钮，光只留给椅子和唱盘</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">按钮 → 灯光聚焦 → 选源 → 胆机静音预热 60 秒 → 解除静音</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">灯光只留椅子和唱盘，其余全暗</text>
    <text x="64" y="366">胆机先静音预热 60 秒，保护灯管和喇叭</text>
    <text x="64" y="396">再按一次倒放，音箱交还 0207 影音室</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA 场景 + moOde · 数据出口：播放状态 / 0802 大屏</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：moode-player/moode</text>
  <!-- 印章 -->
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

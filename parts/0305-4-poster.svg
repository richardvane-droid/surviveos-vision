<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0305-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0305-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0305-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0305-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：地堡笔记本（切片） → 排队卡片 → 阁楼 P1S + 手机推送 -->
    <!-- 笔记本 -->
    <path d="M40 214 l8 -30 h58 l-8 30 Z" stroke-width="1.6"/>
    <path d="M46 210 l6 -22 h48 l-6 22 Z" stroke-width="0.7"/>
    <path d="M30 216 h76 l-2 5 h-76 Z" stroke-width="1.4"/>
    <path d="M56 194 l16 -4 l6 4 l-14 6 Z" stroke-width="0.9"/>
    <path d="M58 196 l12 -3" stroke-width="0.5"/>
    <path d="M60 204 h20 M62 200 h8" stroke-width="0.6"/>
    <!-- 队列卡片（三张叠） -->
    <rect x="150" y="146" width="56" height="30" rx="3" stroke-width="1"/>
    <rect x="144" y="156" width="56" height="30" rx="3" stroke-width="1.2"/>
    <rect x="138" y="166" width="56" height="30" rx="3" stroke-width="1.6"/>
    <rect x="139" y="167" width="54" height="7" fill="url(#p0305-4p-shade)" stroke="none"/>
    <path d="M144 182 h30 M144 188 h20" stroke-width="0.7"/>
    <path d="M150 151 h6 v6 M156 161 h6 v6" stroke-width="0.7"/>
    <path d="M186 178 l-2 -3 l4 0 Z M186 178 v10" stroke-width="0.9"/>
    <!-- 打印机 -->
    <rect x="236" y="176" width="72" height="66" rx="5" stroke-width="1.6"/>
    <rect x="246" y="190" width="40" height="40" rx="2" stroke-width="1"/>
    <rect x="248" y="192" width="36" height="36" fill="url(#p0305-4p-dots)" stroke="none"/>
    <path d="M254 222 h24 M258 218 l8 -10 l8 10" stroke-width="0.9"/>
    <rect x="292" y="186" width="10" height="16" rx="1" stroke-width="0.8"/>
    <path d="M294 190 h6 M294 194 h6" stroke-width="0.5"/>
    <path d="M240 178 h64" stroke-width="0.6"/>
    <circle cx="272" cy="170" r="4" stroke-width="0.9"/><path d="M272 166 v-4" stroke-width="0.9"/>
    <!-- 摄像头 + 手机 -->
    <path d="M300 168 l6 -6 h12 l-4 8 Z" stroke-width="0.9"/>
    <rect x="316" y="212" width="14" height="24" rx="2" stroke-width="1.2"/>
    <path d="M320 232 h6" stroke-width="0.7"/>
    <path d="M323 218 a4 4 0 0 1 4 4 v3 h-8 v-3 a4 4 0 0 1 4 -4 Z M321 226 a2 2 0 0 0 4 0" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M110 200 Q124 190 136 184" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M196 184 Q214 190 232 200" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M232 196 l4 3 l-5 1" stroke-width="1"/>
    <path d="M136 184 l-5 -1 l3 4" stroke-width="1"/>
    <path d="M308 224 h6" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- 地面线 -->
    <path d="M40 268 Q180 262 320 268" stroke-width="1.2"/>
    <path d="M44 272 q40 -3 80 0 M236 272 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0305 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">打印任务队列</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">地堡切好片，阁楼自己排队打</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">切片推送 → 队列按优先级 → 空闲即发 → 开始/结束/失败推送</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">配件 › 玩具 › 试验件，同级先进先出</text>
    <text x="64" y="366">打印机空闲自动发，摄像头随时看层数</text>
    <text x="64" y="396">失败自动暂停队列，人工清理后再继续</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant 自动化 · 数据出口：手机推送 + 摄像头快照</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：OrcaSlicer/OrcaSlicer · greghesp/ha-bambulab</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

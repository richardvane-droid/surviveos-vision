<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0102-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0102-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0102-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0102-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：西窗落日（左） → 作品墙三排灯带（中） → 时钟 22:30（右） -->
    <!-- 西窗 + 半落的太阳 -->
    <rect x="40" y="126" width="64" height="76" rx="2" stroke-width="1.5"/>
    <path d="M72 126 V202 M40 164 H104" stroke-width="0.9"/>
    <path d="M48 190 a24 24 0 0 1 48 0" stroke-width="1.5"/>
    <path d="M72 158 v-8 M54 168 l-6 -5 M90 168 l6 -5 M60 160 l-4 -6 M84 160 l4 -6" stroke-width="1.1"/>
    <path d="M48 190 h48" stroke-width="1.2"/>
    <rect x="42" y="192" width="60" height="8" fill="url(#p0102-3p-shade)" stroke="none"/>
    <path d="M110 150 L160 168" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M110 176 L160 184" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- 作品墙：三排托架，每排上方一条灯带 -->
    <rect x="150" y="112" width="96" height="120" rx="2" stroke-width="1.5"/>
    <path d="M166 112 V232 M182 112 V232 M198 112 V232 M214 112 V232 M230 112 V232" stroke-width="0.5"/>
    <path d="M154 142 H242 M154 178 H242 M154 214 H242" stroke-width="1.4"/>
    <rect x="156" y="126" width="84" height="4" rx="1" stroke-width="0.9"/>
    <rect x="156" y="162" width="84" height="4" rx="1" stroke-width="0.9"/>
    <rect x="156" y="198" width="84" height="4" rx="1" stroke-width="0.9"/>
    <path d="M162 130 l-2 12 M182 130 l-2 12 M202 130 l-2 12 M222 130 l-2 12 M242 130 l-2 12" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <path d="M162 166 l-2 12 M182 166 l-2 12 M202 166 l-2 12 M222 166 l-2 12 M242 166 l-2 12" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <path d="M162 202 l-2 12 M182 202 l-2 12 M202 202 l-2 12 M222 202 l-2 12 M242 202 l-2 12" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <rect x="164" y="134" width="8" height="8" rx="1" stroke-width="1"/><rect x="180" y="134" width="8" height="8" rx="1" stroke-width="1"/><rect x="196" y="134" width="8" height="8" rx="1" stroke-width="1"/><rect x="212" y="134" width="8" height="8" rx="1" stroke-width="1"/>
    <rect x="164" y="170" width="8" height="8" rx="1" stroke-width="1"/><rect x="180" y="170" width="8" height="8" rx="1" stroke-width="1"/><rect x="196" y="170" width="8" height="8" rx="1" stroke-width="1"/><rect x="212" y="170" width="8" height="8" rx="1" stroke-width="1"/>
    <rect x="164" y="206" width="8" height="8" rx="1" stroke-width="1"/><rect x="180" y="206" width="8" height="8" rx="1" stroke-width="1"/><rect x="196" y="206" width="8" height="8" rx="1" stroke-width="1"/>
    <rect x="154" y="216" width="88" height="14" fill="url(#p0102-3p-dots)" stroke="none"/>
    <!-- 时钟 22:30 + 小月亮 -->
    <circle cx="292" cy="172" r="24" stroke-width="1.5"/>
    <path d="M292 172 V154 M292 172 L281 182" stroke-width="1.6"/>
    <path d="M292 150 v3 M292 194 v-3 M270 172 h3 M314 172 h-3" stroke-width="1"/>
    <path d="M298 128 a10 10 0 1 0 8 14 a8 8 0 0 1 -8 -14 Z" stroke-width="1.2"/>
    <path d="M252 160 L266 166" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- 地平线 -->
    <path d="M40 256 Q180 248 320 256" stroke-width="1.2"/>
    <path d="M44 260 q40 -3 80 0 M236 260 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性行勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <!-- 文字层 -->
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0102 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">傍晚亮灯调度</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">接在西窗夕阳后面亮起，不和它抢</text>
  <text x="72" y="216" text-anchor="middle" font-size="8.5" fill="#666">高度角 &lt; 6°</text>
  <text x="198" y="246" text-anchor="middle" font-size="8.5" fill="#666">三段灯带 · 傍晚 40%</text>
  <text x="292" y="212" text-anchor="middle" font-size="8.5" fill="#666">22:30 深夜 · 0:30 关</text>
  <text x="180" y="290" text-anchor="middle" font-size="9.5" fill="#666">sun.sun 高度角 → 傍晚预设 → 深夜预设 → 全关</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">太阳高度角低于 6° 时 10 分钟渐亮到 40%</text>
    <text x="64" y="366">22:30 只留三只关键作品射灯，0:30 全关</text>
    <text x="64" y="396">WLED 本地定时器同步一份，断网照跑</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA 自动化 + WLED 预设 · 数据出口：三段灯带 / 射灯场景状态</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Aircoookie/WLED</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

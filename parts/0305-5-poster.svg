  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">登记初始重量 → 打完回写克数 → 低于 150g 提醒补货</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">每卷一个二维码，扫一下就知道还剩多少克</text><text x="64" y="366">剩余 &lt;150g 提醒补货，库存 >8 卷提示先用完</text><text x="64" y="396">换料或拆件之后抽出接屑盘，端走倒掉</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0603-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0603-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0603-4p-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="p0603-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>

  <g filter="url(#p0603-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 左上：雨云 + 檐沟 -->
    <path d="M52 120 q-10 -2 -8 -10 q2 -8 12 -6 q4 -10 16 -6 q10 -2 12 8 q8 2 4 10 q-4 6 -12 4 Z" stroke-width="1.3"/>
    <path d="M58 128 l-3 7 M68 128 l-3 7 M78 128 l-3 7" stroke-width="0.9"/>
    <path d="M40 146 h56 l-4 6 h-48 Z" stroke-width="1.2"/>
    <path d="M70 152 v14" stroke-width="1.2"/>
    <!-- 左下：弃流小桶 -->
    <path d="M56 172 h28 v26 a14 4 0 0 1 -28 0 Z" stroke-width="1.4"/>
    <ellipse cx="70" cy="172" rx="14" ry="4" stroke-width="1.1"/>
    <path d="M58 190 a14 4 0 0 0 24 0 v6 a14 4 0 0 1 -24 0 Z" fill="url(#p0603-4p-shade)" stroke="none"/>
    <path d="M70 204 v6" stroke-width="0.8"/>
    <path d="M84 180 h18 q6 0 6 6 v-14" stroke-width="1.1"/>
    <!-- 中：大罐 + 水位线 -->
    <rect x="128" y="130" width="84" height="84" rx="8" stroke-width="1.6"/>
    <path d="M132 190 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 16 0" stroke-width="1"/>
    <path d="M132 192 v18 a4 4 0 0 0 4 4 h72 a4 4 0 0 0 4 -4 v-18 Z" fill="url(#p0603-4p-dots)" stroke="none"/>
    <path d="M132 198 h76" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M132 176 h76" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M214 198 h6 M214 176 h6" stroke-width="0.8"/>
    <text x="234" y="201" font-size="8" fill="#3d3d3d" stroke="none">20%</text>
    <text x="234" y="179" font-size="8" fill="#3d3d3d" stroke="none">40%</text>
    <ellipse cx="170" cy="130" rx="10" ry="3" stroke-width="1"/>
    <!-- 右：自来水阀 + 空气隔断 -->
    <g transform="translate(0 40)">
    <path d="M320 120 h-40 q-8 0 -8 8 v14 M320 128 h-40 q0 0 0 0 v14" stroke-width="1.3"/>
    <path d="M292 120 v-10 h14 v10" stroke-width="1.2"/>
    <path d="M294 110 v-8 h10 v8" stroke-width="1.1"/>
    <path d="M299 102 v-6" stroke-width="0.8"/>
    <path d="M274 148 l2 4 M278 148 l-2 4" stroke-width="0.7"/>
    <path d="M276 156 v4 M276 164 v4 M276 172 v4" stroke-width="0.9"/>
    <path d="M262 182 h28 l-3 14 h-22 Z" stroke-width="1.3"/>
    <path d="M276 196 v6 q-20 6 -50 -2" stroke-width="1" stroke-dasharray="3 3"/>
    </g>
    <!-- 箭头 -->
    <path d="M100 178 q14 -14 26 -20" stroke-width="1" stroke-dasharray="3 3"/><path d="M121 156 l6 1 l-3 6" stroke-width="1"/>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0603 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">弃流与补位逻辑</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">脏的先扔掉，空了再补上</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">雨量脉冲 → 弃流 2 分钟后计升数 · 水位 &lt;20% 且无雨 → 自来水补到 40%</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">头两分钟脏水不计数，屋顶面积 × 雨量算进罐升数</text>
    <text x="64" y="366">低于 20% 且未来 12 小时无雨才补，到 40% 就停</text>
    <text x="64" y="396">补水 30 分钟还不达标判为漏水，关阀并报警</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HA · 数据出口：月度雨水占比 + 每场雨进罐量</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：kane5432/ESP32-Water-Level-Sensor</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

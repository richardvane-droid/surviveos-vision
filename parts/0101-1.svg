    <rect x="384" y="34" width="32" height="14" rx="2" stroke-width="1.3"/>
    <path d="M390 39 h20 M390 43 h14" stroke-width="0.7"/>
    <path d="M392 48 l-3 5 M408 48 l3 5" stroke-width="0.9"/>

  <!-- 引线 + 编号（不加滤镜） -->
  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M158 300 H198"/><path d="M140 251 H100"/><path d="M276 192 H316"/><path d="M256 142 H218"/><path d="M374 94 H420"/><path d="M416 41 H438"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="206" cy="300" r="8"/><circle cx="92" cy="251" r="8"/><circle cx="324" cy="192" r="8"/><circle cx="210" cy="142" r="8"/><circle cx="428" cy="94" r="8"/><circle cx="446" cy="41" r="8"/>
    </g>
    <text x="206" y="303.5">1</text><text x="92" y="254.5">2</text><text x="324" y="195.5">3</text><text x="210" y="145.5">4</text><text x="428" y="97.5">5</text><text x="446" y="44.5">6</text>
  </g>
  <!-- 图例 -->
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">胡桃木倾斜展台 · 爆炸图</text>
    <text x="16" y="52">1 手刨四腿底框（留刨痕）</text>
    <text x="16" y="68">2 抽屉层（5 只备用盒）</text>
    <text x="16" y="84">3 12° 倾斜台面（胡桃木）</text>
    <text x="16" y="100">4 毛毡卡槽内衬（27 位）</text>
    <text x="16" y="116">5 PSK 生存盒（盖开 110°）</text>
    <text x="16" y="132">6 黄铜铭牌 PSK No.1</text>
  </g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0101-1</text>
</svg>

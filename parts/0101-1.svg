    <path d="M140 242 L158 232 L214 232 L196 242 Z" stroke-width="1.2"/>
    <path d="M196 242 L214 232 V250 L196 260 Z" stroke-width="1.2"/>
    <path d="M197 243 L213 234 V249 L197 258 Z" fill="url(#p0101-1-shade)" stroke="none"/>

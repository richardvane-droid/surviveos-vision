  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">巡游回窝器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">一张手绘房间图，三个房间自己走</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">触发 → 找反光标记 → 走向下一路点 → 电量低回最近的窝</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">路点就是充电窝、通道口、坡道顶的反光标记</text><text x="64" y="366">通道口低头慢走，坡道前倾，摔了自己起身</text><text x="64" y="396">连找 3 次没找到就蹲下，推送手机</text></g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：鸭身 RK3566 robotd · 数据出口：HA 位置实体（在哪个房间）</text>

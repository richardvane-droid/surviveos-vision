    <path d="M92 196 Q120 196 142 176" stroke-width="1" stroke-dasharray="3 3"/><path d="M136 176 l6 -2 l0 6" stroke-width="1"/>
    <path d="M206 166 H238" stroke-width="1" stroke-dasharray="3 3"/><path d="M234 162 l5 4 l-5 4" stroke-width="1"/>

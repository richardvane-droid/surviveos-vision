    <path d="M77 200 h2 v2 h-2 Z M81 200 h2 v2 h-2 Z M79 204 h2 v2 h-2 Z M77 204 h1 v1 M83 204 h1 v2" stroke-width="0.8"/>
    <path d="M67 191 h4 v4 h-4 Z M77 191 h4 v4 h-4 Z M67 201 h4 v4 h-4 Z" fill="url(#p0702-4p-shade)" stroke="none"/>
    <!-- 中：手机扫码 -->
    <rect x="150" y="120" width="52" height="88" rx="6" stroke-width="1.5"/>
    <rect x="154" y="128" width="44" height="72" rx="2" stroke-width="0.6"/>

  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0702 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">钓具借还账本</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">每根竿都记得自己上次钓了什么</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">扫二维码 → 借出 / 归还 → 填鱼获 → 库存状态 + 饵 × 月份统计</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">竿和饵盒各贴一枚二维码，扫一下即借还</text>
    <text x="64" y="366">归还顺手记鱼种、饵、天气，黑板有数字备份</text>
    <text x="64" y="396">借出超 7 天自动催还，饵在哪月最好用一查便知</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：自托管 Docker · 数据出口：钓具库存页 + 手机鱼获统计</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：m1ndgames/OpenFishing · cohenadair/anglers-log</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

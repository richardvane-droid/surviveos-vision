  <g font-size="8.5" fill="#444"><text x="16" y="46">1 可调脚垫 ×4 + 2020 底框，占地约 0.5×0.5m</text><text x="16" y="59">2 下层三格：耗材干燥箱 / 工具抽屉 / 可整块抽出的接屑盘</text><text x="16" y="72">3 3030 喷砂黑立柱 ×4 + 横梁（0805 欧标规格）</text><text x="16" y="85">4 木台面板：台面与滑轨摩擦面覆木，挡住型材划伤露白</text><text x="16" y="98">5 可翻侧板：铰链 + 磁扣，清碎屑时整块翻开</text></g>

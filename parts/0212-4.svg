<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0212-4-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0212-4-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0212-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">训练计数与周进度 · 流程图</text>
  <g filter="url(#p0212-4-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊：按键板 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 步骤：ESPHome 上报 -->
    <rect x="175" y="49" width="110" height="40" rx="6"/>
    <rect x="177" y="51" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 兜底：离线补记（虚线框） -->
    <rect x="330" y="49" width="120" height="40" rx="6" stroke-dasharray="4 3"/>
    <!-- 数据源 圆柱：周计划 -->
    <path d="M51 132 a34 6 0 0 1 68 0 v34 a34 6 0 0 1 -68 0 Z"/><ellipse cx="85" cy="132" rx="34" ry="6"/>
    <!-- 判断 菱形 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 是 → 亮绿 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0212-4-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z M179 91 h106 v3 h-106 Z" fill="url(#p0212-4-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0212-4-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="165" y="312" width="150" height="30" rx="15"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0212-4-arrow)" stroke-linecap="round">
    <path d="M140 69 H173"/>
    <path d="M285 69 H328" stroke-dasharray="3 3"/>
    <path d="M230 89 V126"/>
    <path d="M119 152 H170" stroke-dasharray="3 3"/>
    <path d="M288 152 H328"/>
    <path d="M230 176 V205 H85 V228"/>
    <path d="M390 170 V228"/>
    <path d="M330 250 H287"/>
    <path d="M230 270 V310"/>
    <path d="M30 250 Q12 250 12 200 V100 Q12 92 22 92 H80 Q88 92 88 84" stroke-dasharray="3 3"/>
  </g>
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">按键板：单击 / 长按</text>
    <text x="230" y="65">ESPHome 上报 HA</text><text x="230" y="79">读拨码重量 · 组数 +1</text>
    <text x="390" y="65">离线 → Flexify 补记</text><text x="390" y="79" font-size="8.5" fill="#666">手机端同步到 wger</text>
    <text x="85" y="152">本周计划表</text><text x="85" y="165" font-size="8.5" fill="#666">动作 · 目标组数</text>
    <text x="230" y="149">组数 ≥ 计划？</text><text x="230" y="162" font-size="8.5" fill="#666">当前动作 · 今天</text>
    <text x="390" y="147">是 → 按键板小灯亮绿</text><text x="390" y="161">该动作今天完成</text>
    <text x="85" y="247">否 → 继续计数</text><text x="85" y="261">等下一组按键</text>
    <text x="230" y="247">wger 周汇总</text><text x="230" y="261">计划 5 天完成 4 天</text>
    <text x="390" y="247">当天结束打包</text><text x="390" y="261">写 wger 训练日志</text>
    <text x="240" y="331">退出训练模式时上屏周进度</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="240" y="198">否</text><text x="290" y="60">兜底</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0212-4</text>
</svg>

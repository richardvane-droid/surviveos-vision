  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">换墙与透气</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">每季度换一批句子，顺便看一眼 CO2</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">memos 三类标签 → 每季度筛一批 → 打印上墙 → 旧的收进宝箱</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">名言、电影、对话三类分流，换季各挑几张</text><text x="64" y="366">换下来的按日期收进尽端那格铁皮宝箱</text><text x="64" y="396">不装通风，只靠一颗 CO2 传感器提醒推门</text></g>

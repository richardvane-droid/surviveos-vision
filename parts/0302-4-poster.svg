<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0302-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="10" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0302-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0302-4p-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="p0302-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>

  <g filter="url(#p0302-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 传感器 水滴 + 温度计（左） -->
    <path d="M70 120 q-20 26 -20 40 a20 20 0 0 0 40 0 q0 -14 -20 -40 Z" stroke-width="1.6"/>
    <path d="M60 162 a12 12 0 0 0 10 10" stroke-width="0.8"/>
    <path d="M56 158 a14 14 0 0 0 28 0 q0 -8 -6 -18 q-8 10 -22 18 Z" fill="url(#p0302-4p-dots)" stroke="none"/>
    <rect x="100" y="120" width="10" height="46" rx="5" stroke-width="1.3"/>
    <circle cx="105" cy="172" r="8" stroke-width="1.3"/>
    <path d="M105 140 v32" stroke-width="2.4"/>
    <path d="M112 130 h4 M112 140 h4 M112 150 h4" stroke-width="0.8"/>
    <!-- HA 小房子（中） -->
    <path d="M150 168 l30 -26 l30 26 v34 h-60 Z" stroke-width="1.6"/>
    <path d="M144 170 l36 -32 l36 32" stroke-width="1.2"/>
    <circle cx="180" cy="180" r="8" stroke-width="1.2"/>
    <path d="M180 172 v-3 M180 188 v3 M172 180 h-3 M188 180 h3" stroke-width="1"/>
    <path d="M152 198 h56 v3 h-56 Z" fill="url(#p0302-4p-shade)" stroke="none"/>
    <text x="180" y="184" text-anchor="middle" font-size="8" fill="#3d3d3d" stroke="none">70%</text>
    <!-- 烘鞋器 + 风扇（右上）  手机（右下） -->
    <rect x="240" y="130" width="52" height="22" rx="4" stroke-width="1.4"/>
    <path d="M250 130 v-10 h6 v10 M276 130 v-10 h6 v10" stroke-width="1.1"/>
    <path d="M244 140 h44" stroke-width="0.6"/>
    <path d="M246 143 h40 v6 h-40 Z" fill="url(#p0302-4p-shade)" stroke="none"/>
    <circle cx="308" cy="141" r="9" stroke-width="1.2"/>
    <path d="M308 141 v-7 M308 141 l6 4 M308 141 l-6 4" stroke-width="1.1"/><circle cx="308" cy="141" r="2" stroke-width="0.9"/>
    <rect x="256" y="166" width="30" height="50" rx="5" stroke-width="1.4"/>
    <rect x="259" y="172" width="24" height="36" rx="2" stroke-width="0.6"/>
    <path d="M263 180 h16 M263 188 h16 M263 196 h10" stroke-width="0.8"/>
    <path d="M286 176 q10 -6 6 -16" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M118 166 H142" stroke-width="1" stroke-dasharray="3 3"/><path d="M138 162 l5 4 l-5 4" stroke-width="1"/>
    <path d="M212 168 Q226 150 234 142" stroke-width="1" stroke-dasharray="3 3"/><path d="M228 140 l6 2 l-2 6" stroke-width="1"/>
    <path d="M212 182 Q236 186 250 190" stroke-width="1" stroke-dasharray="3 3"/><path d="M244 186 l6 4 l-6 3" stroke-width="1"/>
    <!-- 地平 -->
    <path d="M40 258 Q180 250 320 258" stroke-width="1.2"/>
    <path d="M44 262 q40 -3 80 0 M236 262 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0302 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">装备湿度看护</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">睡袋比你更怕梅雨天</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">SHT30 温湿度 → ESPHome → HA 阈值判断 → 烘鞋器 / 除湿风扇 + 推送</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">湿度超 70% 持续 10 分钟才动作，不误报</text>
    <text x="64" y="366">自动开烘鞋器和除湿风扇 30 分钟</text>
    <text x="64" y="396">温度过 35℃ 提醒把气罐搬走</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HomeAssistant · 数据出口：手机推送 + 每日曲线</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：esphome/esphome</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0303-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0303-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0303-4p-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="p0303-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>

  <g filter="url(#p0303-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 时钟（左上） 雨云（左下） -->
    <circle cx="66" cy="132" r="18" stroke-width="1.4"/>
    <path d="M66 132 V120 M66 132 L74 137" stroke-width="1.6"/>
    <path d="M66 116 v3 M66 148 v-3 M50 132 h3 M82 132 h-3" stroke-width="1"/>
    <path d="M48 196 a10 10 0 0 1 10 -14 a14 14 0 0 1 26 2 a9 9 0 0 1 4 17 h-36 a8 8 0 0 1 -4 -5 Z" stroke-width="1.4"/>
    <path d="M54 208 l-3 8 M64 208 l-3 8 M74 208 l-3 8 M84 208 l-3 8" stroke-width="1"/>
    <path d="M52 200 h34 v1 h-34 Z" fill="url(#p0303-4p-shade)" stroke="none"/>
    <!-- HA 场景齿轮（中） -->
    <circle cx="180" cy="168" r="26" stroke-width="1.6"/>
    <circle cx="180" cy="168" r="10" stroke-width="1.2"/>
    <path d="M180 142 v-8 M180 194 v8 M154 168 h-8 M206 168 h8 M162 150 l-6 -6 M198 186 l6 6 M198 150 l6 -6 M162 186 l-6 6" stroke-width="1.6"/>
    <path d="M170 168 a10 10 0 0 0 20 0 a10 10 0 0 1 -20 0 Z" fill="url(#p0303-4p-dots)" stroke="none"/>
    <text x="180" y="230" text-anchor="middle" font-size="9" fill="#3d3d3d" stroke="none">晨起 · 夜读 · 雨夜 · 梅雨</text>
    <!-- 输出：灯 / 帘 / 音箱（右） -->
    <path d="M262 132 h24 v20 q-12 4 -24 0 Z" stroke-width="1.3"/>
    <path d="M266 126 q8 -10 16 0" stroke-width="1"/>
    <path d="M258 140 l-4 -2 M290 140 l4 -2" stroke-width="0.8"/>
    <rect x="258" y="158" width="46" height="8" rx="3" stroke-width="1.3"/>
    <path d="M262 166 v14 h38 v-14" stroke-width="1"/>
    <path d="M263 167 h36 v12 h-36 Z" fill="url(#p0303-4p-shade)" stroke="none"/>
    <path d="M281 180 v6" stroke-width="0.9"/>
    <rect x="262" y="196" width="26" height="30" rx="4" stroke-width="1.3"/>
    <circle cx="275" cy="211" r="7" stroke-width="1"/><circle cx="275" cy="211" r="2" stroke-width="0.8"/>
    <path d="M294 205 q6 6 0 12 M300 200 q10 11 0 22" stroke-width="0.9"/>
    <!-- 箭头 -->
    <path d="M88 138 Q118 150 148 158" stroke-width="1" stroke-dasharray="3 3"/><path d="M142 152 l6 6 l-7 3" stroke-width="1"/>
    <path d="M92 196 Q120 190 148 178" stroke-width="1" stroke-dasharray="3 3"/><path d="M142 176 l7 -2 l-3 7" stroke-width="1"/>
    <path d="M212 158 Q236 148 254 142" stroke-width="1" stroke-dasharray="3 3"/><path d="M247 140 l7 1 l-3 7" stroke-width="1"/>
    <path d="M214 168 H252" stroke-width="1" stroke-dasharray="3 3"/><path d="M248 164 l5 4 l-5 4" stroke-width="1"/>
    <path d="M212 180 Q236 196 254 208" stroke-width="1" stroke-dasharray="3 3"/><path d="M248 202 l6 5 l-7 2" stroke-width="1"/>
    <!-- 地平 -->
    <path d="M40 262 Q180 254 320 262" stroke-width="1.2"/>
    <path d="M44 266 q40 -3 80 0 M236 266 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0303 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">帐篷场景调度器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">雨一来，帐篷自己关帘放雨声</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">时间 + 雨事件 → HA scene → WLED 灯效 · 天窗帘 · 音景</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">四个场景一键覆盖：晨起 / 夜读 / 雨夜 / 梅雨</text>
    <text x="64" y="366">灯效走 WLED，雨声混篝火走 moodist</text>
    <text x="64" y="396">手动开关永远优先，不和人抢</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant + ESPHome · 数据出口：scene 状态 + 推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Aircoookie/WLED · remvze/moodist</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

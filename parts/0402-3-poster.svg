  <text x="46" y="196" font-size="8" fill="#666">扫码取用</text><text x="262" y="182" font-size="8" fill="#666">标签机</text><text x="270" y="236" font-size="8" fill="#666">库存库</text>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0402 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">扫码库存流</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">每个箱子都记得自己装了什么</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">入库录入 → 生成箱码 → 标签机打印 → 扫码取用 → 同步 0801</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">入库即生成二维码，标签字体永远一致</text>
    <text x="64" y="366">扫码看箱内清单，用光自动建议补货</text>
    <text x="64" y="396">全仓可搜，同步 0801 数字孪生库</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：Homebox（自托管）· 数据出口：全仓清单 + 二维码标签</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：sysadminsmedia/homebox</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>

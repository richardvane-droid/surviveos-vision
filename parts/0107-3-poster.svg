<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0107-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0107-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0107-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0107-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：高脚凳（左）→ 吊灯（中）→ 调光条（右） -->
    <!-- 高脚凳 + 压力垫 -->
    <ellipse cx="72" cy="196" rx="24" ry="7" stroke-width="1.5"/>
    <path d="M48 196 v5 a24 7 0 0 0 48 0 v-5" stroke-width="1.2"/>
    <path d="M50 200 a24 6 0 0 0 44 1 v3 a24 6 0 0 1 -44 -1 Z" fill="url(#p0107-3p-shade)" stroke="none"/>
    <path d="M56 206 l-6 46 M88 206 l6 46 M64 205 l-2 47 M80 205 l2 47" stroke-width="1.3"/>
    <path d="M52 236 h40" stroke-width="1"/>
    <path d="M60 190 h24" stroke-width="0.7" stroke-dasharray="2 2"/>
    <path d="M72 180 l-3 -6 M72 180 l3 -6" stroke-width="0.9"/>
    <!-- 吊灯（中） -->
    <path d="M180 100 v22" stroke-width="1.2"/>
    <path d="M172 100 h16" stroke-width="1.4"/>
    <path d="M158 156 l6 -34 h32 l6 34 Z" stroke-width="1.6"/>
    <path d="M160 152 l6 -28 h4 l-6 28 Z" fill="url(#p0107-3p-shade)" stroke="none"/>
    <path d="M158 156 h44" stroke-width="1"/>
    <path d="M174 156 a6 4 0 0 0 12 0" stroke-width="1.2"/>
    <!-- 光锥（虚线）+ 台面 -->
    <path d="M166 162 L130 232 M194 162 L230 232" stroke-width="0.9" stroke-dasharray="3 3"/>
    <path d="M124 232 Q180 226 236 232 v10 Q180 236 124 242 Z" stroke-width="1.4"/>
    <path d="M126 236 Q180 230 234 236 v4 Q180 234 126 240 Z" fill="url(#p0107-3p-dots)" stroke="none"/>
    <path d="M140 224 q40 -6 80 0" stroke-width="0.6"/>
    <!-- 调光条（右） -->
    <rect x="270" y="132" width="30" height="100" rx="6" stroke-width="1.4"/>
    <rect x="278" y="192" width="14" height="34" rx="3" fill="url(#p0107-3p-shade)" stroke="none"/>
    <path d="M285 140 v84" stroke-width="0.8"/>
    <rect x="276" y="190" width="18" height="10" rx="3" stroke-width="1.4"/>
    <path d="M300 142 h6 M300 168 h6 M300 194 h6" stroke-width="0.9"/>
    <!-- 箭头：凳 → 灯 → 调光条 -->
    <path d="M98 188 Q130 176 154 154" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M148 150 l6 4 l-7 3" stroke-width="1"/>
    <path d="M206 150 Q240 160 266 190" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M259 189 l7 1 l-1 -7" stroke-width="1"/>
    <!-- 地平线 -->
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0107 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">落座调光</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">坐下那一刻，灯自己退到三成，只剩台面在发光</text>
  <text x="309" y="145" font-size="7.5" fill="#666">80</text>
  <text x="309" y="197" font-size="7.5" fill="#666">30</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">凳面压力垫 → 日落后有人落座 → 吊灯 5 秒渐暗 30% → 离席 3 分钟回 80%</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">三把凳子任一有人就触发，白天不干预</text>
    <text x="64" y="366">渐变 5 秒，不是啪一下黑，眼睛察觉不到</text>
    <text x="64" y="396">离席 3 分钟自动回迎客亮度，忘了也没事</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HomeAssistant · 数据出口：吊灯亮度实体 + 落座日志</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：esphome/esphome · home-assistant/core</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

    <path d="M62 172 q4 -14 10 -6 q2 -14 8 -10 q4 6 -2 16" stroke-width="1"/>
    <path d="M66 148 q-8 -10 2 -18 q-4 -8 6 -12 M80 146 q8 -10 0 -18 q6 -6 -2 -12" stroke-width="0.9" stroke-dasharray="3 2"/>
    <!-- 中：CO 传感器盒 + 风 -->
    <rect x="152" y="140" width="56" height="40" rx="5" stroke-width="1.5"/>
    <rect x="156" y="144" width="48" height="32" rx="3" stroke-width="0.6"/>
    <circle cx="166" cy="160" r="6" stroke-width="1.1"/>
    <path d="M163 160 h6 M166 157 v6" stroke-width="0.7"/>
    <path d="M178 152 h20 M178 160 h20 M178 168 h14" stroke-width="0.8"/>
    <path d="M154 170 h52 v8 h-52 Z" fill="url(#p0704-3p-dots)" stroke="none"/>
    <path d="M180 180 v14 M170 194 h20" stroke-width="1.1"/>
    <path d="M140 118 q12 -6 24 0 M150 128 q10 -5 20 0" stroke-width="0.9"/>
    <path d="M196 118 q12 -6 24 0 M204 128 q10 -5 20 0" stroke-width="0.9"/>

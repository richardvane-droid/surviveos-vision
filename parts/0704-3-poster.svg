    <path d="M106 168 H144" stroke-width="1" stroke-dasharray="3 3"/><path d="M140 164 l5 4 l-5 4" stroke-width="1"/>
    <path d="M212 160 Q226 150 238 140" stroke-width="1" stroke-dasharray="3 3"/><path d="M232 138 l6 0 l-1 6" stroke-width="1"/>
    <path d="M212 172 Q240 178 272 178" stroke-width="1" stroke-dasharray="3 3"/><path d="M268 174 l5 4 l-5 4" stroke-width="1"/>
    <!-- 地平 -->
    <path d="M40 258 Q180 250 320 258" stroke-width="1.2"/>
    <path d="M44 262 q40 -3 80 0 M236 262 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0704 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">火塘空气看护</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">棚里的一氧化碳，比火星更安静</text>
  <text x="166" y="163" text-anchor="middle" font-size="5" fill="#3d3d3d">CO</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">ZE07 电化学 CO + 风速 → ESP32 本地阈值 → 黄灯 / 蜂鸣 / 推送</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">CO 超 50ppm 亮黄灯，超 150ppm 蜂鸣离台</text>
    <text x="64" y="366">风速超 6m/s 提醒今晚别烤鱼，火星不进芦苇</text>
    <text x="64" y="396">判断全在 ESP32 本地，断网照样响</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome 本地 · 数据出口：柱上黄灯 + 蜂鸣器 + HA 推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Bjk8kds/esphome-winsen-co-sensor · esphome/esphome</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

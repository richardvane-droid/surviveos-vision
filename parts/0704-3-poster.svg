    <path d="M250 124 v76 M262 124 v76" stroke-width="1.4"/>
    <path d="M252 128 v68 h4 v-68 Z" fill="url(#p0704-3p-shade)" stroke="none"/>
    <circle cx="256" cy="136" r="7" stroke-width="1.3"/>
    <path d="M256 124 v-4 M266 129 l3 -3 M246 129 l-3 -3 M269 140 h3 M243 140 h-3" stroke-width="1"/>
    <rect x="278" y="148" width="30" height="50" rx="5" stroke-width="1.4"/>
    <rect x="281" y="154" width="24" height="36" rx="2" stroke-width="0.6"/>
    <path d="M285 162 h16 M285 170 h16 M285 178 h10" stroke-width="0.8"/>
    <path d="M308 156 q10 -6 6 -16" stroke-width="0.8"/>

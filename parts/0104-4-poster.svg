<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0104-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0104-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0104-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0104-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：日历 1 号（左） → 满了的下排麻绳（中） → 牛皮纸相册（右） -->
    <!-- 日历 -->
    <rect x="40" y="136" width="60" height="64" rx="3" stroke-width="1.5"/>
    <path d="M40 150 H100" stroke-width="1.2"/>
    <rect x="42" y="138" width="56" height="10" fill="url(#p0104-4p-shade)" stroke="none"/>
    <path d="M52 132 v8 M88 132 v8" stroke-width="1.3"/>
    <path d="M48 160 h8 M60 160 h8 M72 160 h8 M84 160 h8 M48 172 h8 M60 172 h8 M72 172 h8 M84 172 h8 M48 184 h8 M60 184 h8" stroke-width="0.6"/>
    <circle cx="52" cy="159" r="6" stroke-width="1.2"/>
    <!-- 下排麻绳，夹满了相片 -->
    <path d="M130 128 q50 20 100 0" stroke-width="1.8"/>
    <path d="M144 134 v8 M164 139 v8 M184 140 v8 M204 139 v8 M224 134 v8" stroke-width="1.1"/>
    <rect x="136" y="142" width="18" height="22" rx="1" stroke-width="1.1"/>
    <rect x="156" y="147" width="18" height="22" rx="1" stroke-width="1.1"/>
    <rect x="176" y="148" width="18" height="22" rx="1" stroke-width="1.1"/>
    <rect x="196" y="147" width="18" height="22" rx="1" stroke-width="1.1"/>
    <rect x="216" y="142" width="18" height="22" rx="1" stroke-width="1.1"/>
    <rect x="138" y="144" width="14" height="14" fill="url(#p0104-4p-dots)" stroke="none"/>
    <rect x="158" y="149" width="14" height="14" fill="url(#p0104-4p-dots)" stroke="none"/>
    <rect x="178" y="150" width="14" height="14" fill="url(#p0104-4p-shade)" stroke="none"/>
    <rect x="198" y="149" width="14" height="14" fill="url(#p0104-4p-dots)" stroke="none"/>
    <rect x="218" y="144" width="14" height="14" fill="url(#p0104-4p-dots)" stroke="none"/>
    <!-- 取下最早的两张（虚线轮廓，向下飘） -->
    <rect x="150" y="182" width="18" height="22" rx="1" stroke-width="0.9" stroke-dasharray="2 2" transform="rotate(-8 159 193)"/>
    <rect x="186" y="186" width="18" height="22" rx="1" stroke-width="0.9" stroke-dasharray="2 2" transform="rotate(6 195 197)"/>
    <path d="M160 172 v6 M196 172 v8" stroke-width="0.7" stroke-dasharray="2 2"/>
    <!-- 牛皮纸相册（右） -->
    <path d="M254 150 L316 150 L322 156 V218 L260 218 L254 212 Z" stroke-width="1.5"/>
    <path d="M254 150 V212 L260 218 M254 212 H316 L322 218 M316 150 V212" stroke-width="1"/>
    <path d="M255 151 h60 v60 h-60 Z" fill="url(#p0104-4p-shade)" stroke="none" stroke-opacity="0.3"/>
    <path d="M262 160 h46 M262 168 h30" stroke-width="0.7" stroke-opacity="0.6"/>
    <rect x="270" y="176" width="30" height="26" rx="1" stroke-width="1.1" fill="none"/>
    <path d="M264 174 l4 6 M306 174 l-4 6 M264 208 l4 -6 M306 208 l-4 -6" stroke-width="0.8"/>
    <path d="M254 150 q-6 8 -6 30 q0 22 6 32" stroke-width="1"/>
    <!-- 箭头 -->
    <path d="M106 168 Q118 168 128 166" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M226 190 Q238 190 248 186" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地平线 -->
    <path d="M40 256 Q180 248 320 256" stroke-width="1.2"/>
    <path d="M44 260 q40 -3 80 0 M236 260 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性行勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <!-- 文字层 -->
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0104 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">月度换展归档</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">墙上永远有空夹子，相册永远在长</text>
  <text x="52" y="162.5" text-anchor="middle" font-size="7" fill="#2a2a2a">1</text>
  <text x="70" y="218" text-anchor="middle" font-size="8.5" fill="#666">每月 1 号提醒</text>
  <text x="182" y="230" text-anchor="middle" font-size="8.5" fill="#666">满 27 张 → 取下最早 10 张</text>
  <text x="288" y="236" text-anchor="middle" font-size="8.5" fill="#666">当年牛皮纸相册</text>
  <text x="180" y="290" text-anchor="middle" font-size="9.5" fill="#666">日历提醒 → 数夹子 → 满则归档 10 张 → 铅笔句子录入描述</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">下排满 27 张才动，取下最早 10 张进相册</text>
    <text x="64" y="366">背面铅笔那句话录入描述字段，正面不写字</text>
    <text x="64" y="396">相册分“在墙上 / 已归档 2026”，随时能翻</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA 日历自动化 + Immich · 数据出口：两组相册 / 归档记录</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：immich-app/immich · home-assistant/core</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0304-5-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0304-5-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0304-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">电池健康看护 · 流程图</text>
  <g filter="url(#p0304-5-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱：JK BMS -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤：ESP32 解析 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断 1：温度 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 是 → 切断充电 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行：均衡 / 判断 2：压差 / 硬件兜底 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <path d="M230 226 l58 24 l-58 24 l-58 -24 Z"/>
    <rect x="330" y="230" width="120" height="40" rx="6" stroke-dasharray="4 3"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0304-5-shade)" stroke="none"/>
    <path d="M232 274 l56 -24 l4 2 l-58 26 Z" fill="url(#p0304-5-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z M34 272 h106 v3 h-106 Z" fill="url(#p0304-5-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="165" y="312" width="150" height="30" rx="15"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0304-5-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M196 72 Q160 72 140 72" stroke-dasharray="3 3"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M230 176 V224"/>
    <path d="M390 170 V228" stroke-dasharray="3 3"/>
    <path d="M172 250 H142"/>
    <path d="M230 274 V310"/>
    <path d="M390 270 V327 H317"/>
    <path d="M85 270 V327 H163"/>
  </g>
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">每 10 秒读一次 BMS</text>
    <text x="230" y="74">JK BMS</text><text x="230" y="87" font-size="8.5" fill="#666">串口 / 蓝牙</text>
    <text x="85" y="147">ESP32 解析数据帧</text><text x="85" y="161" font-size="8.5" fill="#666">单体电压 · 温度 · 循环数</text>
    <text x="230" y="149">温度越界？</text><text x="230" y="162" font-size="8.5" fill="#666">&gt;45℃ 或 &lt;0℃</text>
    <text x="390" y="147">是 → 切断充电继电器</text><text x="390" y="161">立即推送手机</text>
    <text x="85" y="247">是 → 开启均衡</text><text x="85" y="261">压差记入待办</text>
    <text x="230" y="247">压差 &gt; 50mV？</text><text x="230" y="260" font-size="8.5" fill="#666">单体最高 − 最低</text>
    <text x="390" y="247">BMS 硬件保护独立生效</text><text x="390" y="261" font-size="8.5" fill="#666">软件挂了也会断电</text>
    <text x="240" y="331">写 HA 曲线 · 每月健康报告</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="240" y="200">否</text><text x="156" y="244">是</text><text x="240" y="294">否</text><text x="398" y="200">兜底</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0304-5</text>
</svg>

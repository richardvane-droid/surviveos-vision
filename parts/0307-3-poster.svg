  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0307 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">三轴安全闸</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">门一开就停：安全不交给网页</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">cncjs 下发 → 固件解析 → 限位 / 门磁 / 探针三路直连 → 异常即停</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">限位定行程，门磁做安全门输入，探针测刀长与 Z 零</text><text x="64" y="366">VFD 主轴走 RS485 / Modbus，由固件调速与启停</text><text x="64" y="396">门开 / 丢步 / 过流任一触发即进给暂停并抬刀</text></g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：grblHAL（Teensy 4.1）或 FluidNC（ESP32）· 数据出口：cncjs 日志</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：grblHAL/core · bdring/FluidNC</text>

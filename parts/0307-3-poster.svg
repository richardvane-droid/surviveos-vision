  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0307 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">翻面加工器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">不追真五轴：转一下，再当三轴切</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">CAM 姿态段 → A/C 转位锁定 → 探针重测 → 三轴刀路</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">每一段都是能单独看懂的三轴程序</text><text x="64" y="366">换面后探针重测 Z，误差 >0.05mm 就停</text><text x="64" y="396">门开 / 丢步 / 过流任一触发即暂停</text></g>

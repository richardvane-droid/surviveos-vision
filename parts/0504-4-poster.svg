    <path d="M110 174 Q126 172 146 172" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M214 172 Q232 172 250 168" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M142 168 l5 4 l-5 4 M246 164 l5 4 l-5 4" stroke-width="1"/>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0504 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">滴灌调度器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">不看钟点看土，渴了才浇、浇了再测</text>
  <text x="68" y="232" text-anchor="middle" font-size="8.5" fill="#666">每层一颗湿度探头</text>
  <text x="180" y="212" text-anchor="middle" font-size="8.5" fill="#666">&lt;40% 才开阀</text>
  <text x="288" y="232" text-anchor="middle" font-size="8.5" fill="#666">该层阀 20 秒</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">四层探头 → 阈值 + 天气 + 气温 → 分层电磁阀 → 复测补浇</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每半小时逐层判断，低于 40% 才给这一层浇 20 秒</text>
    <text x="64" y="366">十分钟后复测，不到 55% 再补，最多三轮</text>
    <text x="64" y="396">全部在 ESP32 本地跑，断网照常浇</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome（ESP32 本地） · 数据出口：Mycodo 曲线 + 侧面墨水屏</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：makstech/esphome-irrigation-system</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

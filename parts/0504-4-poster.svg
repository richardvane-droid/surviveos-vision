    <path d="M256 210 h64" stroke-width="1.3"/>
    <path d="M268 210 q0 -14 4 -20 M272 200 q6 -6 10 -4 q-2 6 -10 6 M270 194 q-6 -6 -10 -4 q2 6 10 6" stroke-width="1.1"/>
    <path d="M288 210 q0 -14 4 -20 M292 200 q6 -6 10 -4 q-2 6 -10 6 M290 194 q-6 -6 -10 -4 q2 6 10 6" stroke-width="1.1"/>
    <path d="M308 210 q0 -14 4 -20 M312 200 q6 -6 10 -4 q-2 6 -10 6 M310 194 q-6 -6 -10 -4 q2 6 10 6" stroke-width="1.1"/>

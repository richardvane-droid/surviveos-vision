  <g font-size="8.5" fill="#444"><text x="16" y="46">1 地面基准面 1.5×2m（床下净高 1700）</text><text x="16" y="59">2 轻钢龙骨围合框架 · 三面，不承重可拆</text><text x="16" y="72">3 9mm 木饰面板 · 拆掉不影响床体</text><text x="16" y="85">4 隐藏滑轨 + 滑车 ×2（东侧长墙靠南）</text><text x="16" y="98">5 40cm 帆布门帘 + 下沿配重杆</text><text x="16" y="111">6 床板 1750 —— 这间密室的天花</text></g>

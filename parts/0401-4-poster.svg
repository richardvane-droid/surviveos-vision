  <text x="55" y="176" font-size="8" fill="#666">碰一下</text><text x="256" y="238" font-size="8" fill="#666">推送 · 白板</text>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0401 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">借还归位提醒</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">工具去哪了，墙比你先知道</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">NFC 碰一下 → HA 借出 / 归还状态机 → 每晚巡检 → 推送 + 中枢屏</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">碰一下借出，再碰一下归还，零登记</text>
    <text x="64" y="366">3 天未还推送借用人，7 天中枢屏亮黄</text>
    <text x="64" y="396">小白板手写借出卡兜底，断网照常</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant · 数据出口：借出清单实体 + 手机推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：home-assistant/core</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

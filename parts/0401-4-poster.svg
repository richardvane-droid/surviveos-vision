    <path d="M212 168 Q232 158 246 152" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M243.9 156.9 L248 151 L240.9 149.5" stroke-width="1"/>
    <path d="M212 188 Q250 200 284 204" stroke-width="1" stroke-dasharray="3 3"/>

    <rect x="76" y="140" width="26" height="44" rx="5" stroke-width="1.4"/>
    <rect x="79" y="146" width="20" height="30" rx="2" stroke-width="0.6"/>
    <path d="M83 154 h12 M83 162 h12 M83 170 h6" stroke-width="0.8"/>
    <circle cx="89.0" cy="180" r="1.6" stroke-width="0.8"/>

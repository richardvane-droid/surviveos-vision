  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">Frigate 检测 → WhosAtMyFeeder 分种 → BirdNET 声纹印证 → 新物种推送</text>
  <g font-size="11" fill="#2a2a2a">

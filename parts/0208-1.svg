    <text x="16" y="68">2 多层板箱体（内填吸音棉）</text>
    <text x="16" y="84">3 分频器（电感 / 电容）</text>
    <text x="16" y="100">4 12 寸低音单元</text>
    <text x="16" y="116">5 中音单元 + 号角高音</text>
    <text x="16" y="132">6 前面网罩（磁吸）</text>

      <circle cx="216" cy="300" r="8"/><circle cx="120" cy="240" r="8"/><circle cx="320" cy="170" r="8"/><circle cx="240" cy="122" r="8"/><circle cx="290" cy="92" r="8"/><circle cx="452" cy="40" r="8"/>

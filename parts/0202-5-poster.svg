<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0202-5p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0202-5p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0202-5p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0202-5p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 花洒 + 水汽 -->
    <path d="M44 128 h14 v-12 h16" stroke-width="1.4"/>
    <path d="M40 128 h22 l4 8 h-30 Z" stroke-width="1.4"/>
    <path d="M46 140 v10 M52 140 v14 M58 140 v10 M64 140 v14" stroke-width="0.8" stroke-dasharray="2 2"/>
    <path d="M78 160 q6 -8 0 -16 q-6 -8 0 -16 M90 168 q6 -8 0 -16 q-6 -8 0 -16 M102 160 q6 -8 0 -16 q-6 -8 0 -16" stroke-width="0.9"/>
    <path d="M36 176 h56" stroke-width="1"/>
    <!-- 湿度探头（水滴 + %） -->
    <path d="M136 108 q-12 16 -12 24 a12 12 0 0 0 24 0 q0 -8 -12 -24 Z" stroke-width="1.5"/>
    <path d="M128 136 a12 10 0 0 0 16 4 v-6 a12 10 0 0 1 -16 -4 Z" fill="url(#p0202-5p-shade)" stroke="none"/>
    <rect x="124" y="150" width="24" height="10" rx="2" stroke-width="1"/>
    <!-- ESP32 判断板 -->
    <rect x="150" y="196" width="60" height="40" rx="4" stroke-width="1.5"/>
    <rect x="160" y="204" width="20" height="14" rx="1" stroke-width="1"/>
    <path d="M156 226 h48 M182 206 h22 M182 212 h22" stroke-width="0.7"/>
    <path d="M160 236 v4 M168 236 v4 M176 236 v4 M184 236 v4 M192 236 v4 M200 236 v4" stroke-width="0.8"/>
    <path d="M186 216 l6 -6 M190 216 l6 -6" stroke-width="0.6"/>
    <!-- 排风扇 -->
    <circle cx="276" cy="150" r="26" stroke-width="1.6"/>
    <circle cx="276" cy="150" r="4" stroke-width="1.2"/>
    <path d="M276 146 q10 -20 20 -8 q-8 4 -18 8 M280 152 q20 8 12 20 q-4 -8 -14 -16 M272 154 q-22 4 -18 -12 q6 4 18 8" stroke-width="1.2"/>
    <path d="M254 128 h44 v44 h-44 Z" stroke-width="0.7" stroke-dasharray="3 3"/>
    <path d="M306 138 h10 M306 150 h14 M306 162 h10" stroke-width="0.9"/>
    <!-- 计时器 -->
    <circle cx="276" cy="216" r="16" stroke-width="1.4"/>
    <path d="M276 216 V204 M276 216 L284 220 M276 198 v-4 M270 194 h12" stroke-width="1.3"/>
    <path d="M276 204 a12 12 0 0 1 8 16 Z" fill="url(#p0202-5p-dots)" stroke="none"/>
    <!-- 箭头 -->
    <path d="M108 138 Q116 132 122 128" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M136 162 Q140 186 150 200" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M210 208 Q230 196 250 170" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M210 226 Q236 232 258 222" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M119 130 l4 -3 v4 M146 196 l4 4 l-5 1 M247 173 l4 -4 l-5 -1 M254 221 l4 1 l-3 3" stroke-width="1"/>
    <!-- 特性勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0202 · L5</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">湿度排风控制</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">淋浴一结束，潮气自己找门出去</text>
  <g font-size="8.5" fill="#666" text-anchor="middle">
    <text x="64" y="190">淋浴间</text>
    <text x="136" y="172">湿度探头</text>
    <text x="180" y="252">ESP32 本地判断</text>
    <text x="276" y="190">排风扇</text>
    <text x="276" y="246">20 分钟计时</text>
  </g>
  <g font-size="8" fill="#555" text-anchor="middle">
    <text x="234" y="206">&gt; 70% 开</text>
    <text x="234" y="218">&lt; 60% 停</text>
  </g>
  <text x="180" y="298" text-anchor="middle" font-size="9.5" fill="#666">探头 10 秒一拍 → 70% 开扇计时 → 20 分钟或 60% 停</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">连续 3 次超 70% 才开，不被一次喷溅骗到</text>
    <text x="64" y="366">20 分钟计时或降回 60%，先到先停</text>
    <text x="64" y="396">断网照转；探头离线每小时通风 5 分钟</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESP32 本地（ESPHome） · 数据出口：HA 湿度曲线 / 运行时长</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：patrickcollins12/esphome-fan-controller</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

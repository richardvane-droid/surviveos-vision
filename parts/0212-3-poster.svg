<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0212-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0212-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0212-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0212-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：手环（左） → ESP32（中上） → 大屏（右） -->
    <!-- 手环 -->
    <rect x="52" y="184" width="36" height="44" rx="8" stroke-width="1.6"/>
    <rect x="58" y="192" width="24" height="28" rx="2" stroke-width="0.9"/>
    <path d="M62 184 v-16 q8 -6 16 0 v16 M62 228 v16 q8 6 16 0 v-16" stroke-width="1.3"/>
    <path d="M64 170 h12 M64 242 h12" stroke-width="0.7"/>
    <path d="M70 214 l-5 -5 a3 3 0 0 1 5 -3 a3 3 0 0 1 5 3 Z" stroke-width="1.1"/>
    <path d="M60 200 h20" stroke-width="0.6"/>
    <path d="M60 216 h20 v3 h-20 Z" fill="url(#p0212-3p-shade)" stroke="none"/>
    <path d="M96 198 a12 12 0 0 1 0 16 M103 192 a20 20 0 0 1 0 28" stroke-width="0.9" stroke-dasharray="2 3"/>
    <!-- ESP32 -->
    <rect x="160" y="120" width="40" height="40" rx="3" stroke-width="1.6"/>
    <rect x="168" y="128" width="24" height="24" rx="1" stroke-width="0.9"/>
    <rect x="170" y="130" width="20" height="20" fill="url(#p0212-3p-dots)" stroke="none"/>
    <path d="M160 128 h-6 M160 140 h-6 M160 152 h-6 M200 128 h6 M200 140 h6 M200 152 h6 M168 160 v6 M180 160 v6 M192 160 v6" stroke-width="1"/>
    <path d="M180 120 v-10 M174 110 h12 M177 106 h6" stroke-width="1.1"/>
    <!-- 大屏 -->
    <rect x="240" y="176" width="84" height="56" rx="3" stroke-width="1.6"/>
    <rect x="243" y="179" width="78" height="50" rx="2" stroke-width="0.7"/>
    <path d="M282 232 v10 M268 243 h28" stroke-width="1.3"/>
    <path d="M248 204 h12 l4 -12 l6 24 l6 -20 l4 8 h36" stroke-width="1.4"/>
    <path d="M254 194 l-3 -3 a2 2 0 0 1 3 -2 a2 2 0 0 1 3 2 Z" stroke-width="0.9"/>
    <rect x="250" y="216" width="64" height="5" rx="1" stroke-width="0.8"/>
    <path d="M251 217 h40 v3 h-40 Z" fill="url(#p0212-3p-shade)" stroke="none"/>
    <path d="M300 188 h14 M300 192 h10" stroke-width="0.6"/>
    <!-- 箭头：手环 → ESP32 → 大屏 -->
    <path d="M106 186 Q130 160 156 142" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M204 142 Q222 160 240 188" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地面线 -->
    <path d="M40 268 Q180 262 320 268" stroke-width="1.2"/>
    <path d="M44 272 q40 -3 80 0 M236 272 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0212 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">训练心率上屏</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">心跳一过 100，整面墙都变成你的秒表</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">手环 BLE → ESP32 → HA 心率实体 → 大屏训练视图 → 训练记录</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">有人 + 心率过 100 满 30 秒，自动切黑底大数字</text>
    <text x="64" y="366">按区间变色：绿 &lt;120 · 黄 120~150 · 红 &gt;150</text>
    <text x="64" y="396">手环断连计时不停，回落 5 分钟切回并记档</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HA · 数据出口：sensor.heart_rate + 训练记录</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：esphome/esphome · wger-project/wger</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

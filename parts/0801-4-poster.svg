  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0801 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">找东西</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">说一声，地图上就亮一个点</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">语音 / 键盘 → 模糊匹配物品库 → 箱号 → 格位 → 地图亮点 + 箱内照片</text>
  <g font-size="11" fill="#2a2a2a">

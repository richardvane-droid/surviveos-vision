  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0307 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">开机前先问电</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">电够不够、屑往哪去，机器自己不管</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">主轴请求 → 查 0304 的 SOC → 先开集尘分路阀 → 3 秒后通主轴</text>
  <g font-size="11" fill="#2a2a2a"><text x="64" y="336">电池低或电摩在充电，就只给低功率模式</text><text x="64" y="366">集尘和阁楼分路阀先开，主轴停后延时 30 秒再关</text><text x="64" y="396">木屑与铝屑分路阀和集尘桶分开，绝不混用</text></g>

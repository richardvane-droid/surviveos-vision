<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0304-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0304-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0304-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0304-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：储能电量（左） → 四级阈值台阶（中上） → 输出口与负载（右） -->
    <!-- 电池 -->
    <rect x="50" y="178" width="40" height="56" rx="4" stroke-width="1.6"/>
    <rect x="62" y="172" width="16" height="6" rx="1" stroke-width="1.2"/>
    <rect x="56" y="186" width="28" height="8" rx="1" stroke-width="0.8"/>
    <rect x="56" y="197" width="28" height="8" rx="1" stroke-width="0.8"/>
    <rect x="56" y="208" width="28" height="8" rx="1" stroke-width="0.8"/>
    <rect x="56" y="219" width="28" height="8" rx="1" stroke-width="0.8"/>
    <rect x="57" y="209" width="26" height="6" fill="url(#p0304-4p-shade)" stroke="none"/>
    <rect x="57" y="220" width="26" height="6" fill="url(#p0304-4p-shade)" stroke="none"/>
    <path d="M94 186 h6 M94 198 h6 M94 210 h6 M94 222 h6" stroke-width="0.6"/>
    <!-- 四级台阶 80 / 50 / 30 / 20 -->
    <path d="M148 164 v-46 h16 v12 h16 v12 h16 v12 h16 v10 Z" stroke-width="1.6"/>
    <path d="M150 162 v-42 h12 v12 h16 v12 h16 v12 h16 v6 Z" fill="url(#p0304-4p-dots)" stroke="none"/>
    <path d="M156 124 h4 M172 136 h4 M188 148 h4 M204 160 h4" stroke-width="0.9"/>
    <circle cx="204" cy="114" r="6" stroke-width="1.2"/>
    <path d="M204 104 v-3 M204 124 v3 M194 114 h-3 M214 114 h3 M197 107 l-2 -2 M211 121 l2 2 M211 107 l2 -2 M197 121 l-2 2" stroke-width="0.9"/>
    <!-- 输出口排插 -->
    <rect x="244" y="176" width="84" height="22" rx="3" stroke-width="1.6"/>
    <circle cx="256" cy="187" r="5" stroke-width="1"/><circle cx="278" cy="187" r="5" stroke-width="1"/><circle cx="300" cy="187" r="5" stroke-width="1"/><circle cx="322" cy="187" r="5" stroke-width="1"/>
    <path d="M254 185 v4 M258 185 v4 M276 185 v4 M280 185 v4" stroke-width="0.8"/>
    <path d="M297 184 l6 6 M303 184 l-6 6 M319 184 l6 6 M325 184 l-6 6" stroke-width="1.2"/>
    <path d="M256 198 v10 M278 198 v10 M300 198 v10 M322 198 v10" stroke-width="0.8" stroke-dasharray="2 2"/>
    <!-- 负载：串灯 / 气象站 / 打印机 / 手机 -->
    <circle cx="256" cy="216" r="6" stroke-width="1.3"/><path d="M253 222 h6 v3 h-6 Z" stroke-width="1"/>
    <path d="M278 210 v20 M272 212 h12 M272 212 a3 2 0 1 0 -6 0 a3 2 0 1 0 6 0 M290 212 a3 2 0 1 0 -6 0 a3 2 0 1 0 6 0 M274 230 h8" stroke-width="1"/>
    <rect x="292" y="214" width="16" height="12" rx="2" stroke-width="1.2"/><path d="M296 214 v-4 h8 v4 M295 220 h10" stroke-width="0.9"/>
    <rect x="316" y="210" width="12" height="20" rx="2" stroke-width="1.2"/><path d="M319 227 h6 M319 213 h6" stroke-width="0.7"/>
    <!-- 箭头 -->
    <path d="M96 176 Q122 150 146 138" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M214 148 Q232 160 250 174" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地面线 -->
    <path d="M40 268 Q180 262 320 268" stroke-width="1.2"/>
    <path d="M44 272 q40 -3 80 0 M236 272 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0304 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">负载调度器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">电量像水位，谁先关灯早就排好了队</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">SOC + 光伏输入 → 四级阈值 → 按优先级开关输出口 → 大屏日报</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">串灯 › 气象站 › 打印机待机 › 楼下充电，四级优先</text>
    <text x="64" y="366">80 / 50 / 30 / 20% 逐级断电，回升 10% 才恢复</text>
    <text x="64" y="396">低于 20% 推送“今晚省着用”，白天够用自动放开</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant 自动化 · 数据出口：0802 大屏 · 每日发电量</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：tolwi/hassio-ecoflow-cloud</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

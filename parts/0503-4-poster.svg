<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0503-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0503-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0503-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0503-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 左：陶盆 + 探针 -->
    <ellipse cx="70" cy="160" rx="24" ry="8" stroke-width="1.6"/>
    <path d="M46 160 l5 34 a19 6 0 0 0 38 0 l5 -34" stroke-width="1.4"/>
    <path d="M72 200 a19 6 0 0 0 17 -6 l4 -30 a24 8 0 0 1 -21 8 Z" fill="url(#p0503-4p-shade)" stroke="none"/>
    <path d="M70 156 q-2 -14 4 -22 M72 142 q8 -6 12 -2 q-4 6 -12 6 M71 136 q-8 -6 -12 -2 q4 6 12 6" stroke-width="1.1"/>
    <path d="M84 158 v-30 h6 v30" stroke-width="1.3"/>
    <path d="M84 132 h6 M84 138 h6" stroke-width="0.6"/>
    <path d="M92 124 q4 -4 8 0 M94 118 q6 -6 12 0" stroke-width="0.8"/>
    <!-- 中：HA 小房子 + 阈值 -->
    <path d="M150 168 l30 -26 l30 26 v34 h-60 Z" stroke-width="1.6"/>
    <path d="M144 170 l36 -32 l36 32" stroke-width="1.2"/>
    <path d="M166 186 h28 M166 194 h20" stroke-width="0.9"/>
    <path d="M152 198 h56 v3 h-56 Z" fill="url(#p0503-4p-shade)" stroke="none"/>
    <path d="M166 180 h6 l4 -8 l4 8 h14" stroke-width="1"/>
    <!-- 右：手机通知 + 墨水屏 -->
    <rect x="270" y="140" width="30" height="50" rx="5" stroke-width="1.4"/>
    <rect x="273" y="146" width="24" height="36" rx="2" stroke-width="0.6"/>
    <path d="M277 154 h16 M277 162 h16 M277 170 h10" stroke-width="0.8"/>
    <path d="M300 150 q10 -6 6 -16" stroke-width="0.8"/>
    <rect x="288" y="196" width="40" height="24" rx="2" stroke-width="1.3"/>
    <path d="M292 203 h20 M292 209 h28 M292 215 h14" stroke-width="0.7"/>
    <path d="M290 218 h36 v2 h-36 Z" fill="url(#p0503-4p-shade)" stroke="none"/>
    <!-- 箭头 -->
    <path d="M102 176 Q122 176 142 180" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M214 180 Q236 176 262 168" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M138 176 l5 4 l-5 4 M258 164 l5 4 l-5 4" stroke-width="1"/>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0503 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">浇水提醒器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">二十盆花，谁渴了谁自己举手</text>
  <text x="70" y="214" text-anchor="middle" font-size="8.5" fill="#666">每盆一根探针</text>
  <text x="180" y="216" text-anchor="middle" font-size="8.5" fill="#666">按物种取阈值</text>
  <text x="293" y="234" text-anchor="middle" font-size="8.5" fill="#666">推送 + 墨水屏</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">b-parasite 探针 → 植物实体阈值 → 持续 6 小时 → 推送名单</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每盆一根纽扣电池探针，蓝牙广播湿度光照温度</text>
    <text x="64" y="366">多肉 15%、绣球 40%，阈值按物种自动取</text>
    <text x="64" y="396">梅雨季饱和两天也告警，提醒挪到屋檐下</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant · 数据出口：手机推送 + 花架旁墨水屏名单</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：rbaron/b-parasite · Olen/homeassistant-plant</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

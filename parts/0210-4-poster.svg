<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0210-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="10" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0210-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0210-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0210-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 货架（左）：三层，罐头 / 米砖 / 水桶 -->
    <path d="M40 130 v100 M104 130 v100" stroke-width="1.6"/>
    <path d="M40 160 H104 M40 195 H104 M40 230 H104" stroke-width="1.3"/>
    <circle cx="52" cy="152" r="6" stroke-width="1"/><circle cx="66" cy="152" r="6" stroke-width="1"/><circle cx="80" cy="152" r="6" stroke-width="1"/><circle cx="94" cy="152" r="6" stroke-width="1"/>
    <rect x="46" y="172" width="22" height="20" rx="2" stroke-width="1"/><rect x="74" y="172" width="22" height="20" rx="2" stroke-width="1"/>
    <path d="M48 186 h18 v4 h-18 Z M76 186 h18 v4 h-18 Z" fill="url(#p0210-4p-shade)" stroke="none"/>
    <path d="M46 228 v-20 a6 3 0 0 1 12 0 v20 M62 228 v-20 a6 3 0 0 1 12 0 v20 M78 228 v-20 a6 3 0 0 1 12 0 v20" stroke-width="1"/>
    <path d="M40 232 h64 v4 h-64 Z" fill="url(#p0210-4p-dots)" stroke="none"/>
    <!-- 计算圆（中）：大数字 -->
    <circle cx="180" cy="176" r="36" stroke-width="1.6"/>
    <circle cx="180" cy="176" r="31" stroke-width="0.6"/>
    <path d="M152 198 a36 36 0 0 0 56 0 v4 a36 36 0 0 1 -56 0 Z" fill="url(#p0210-4p-shade)" stroke="none"/>
    <path d="M168 130 l4 -6 M192 130 l-4 -6 M180 134 v-8" stroke-width="0.8"/>
    <!-- 采购单（右）：夹板 + 勾选 -->
    <rect x="256" y="128" width="64" height="88" rx="4" stroke-width="1.6"/>
    <path d="M276 128 v-6 h24 v6" stroke-width="1.3"/>
    <path d="M282 124 h12" stroke-width="0.8"/>
    <rect x="262" y="142" width="8" height="8" stroke-width="1"/><path d="M264 146 l2 2 l4 -5" stroke-width="1"/>
    <rect x="262" y="160" width="8" height="8" stroke-width="1"/><path d="M264 164 l2 2 l4 -5" stroke-width="1"/>
    <rect x="262" y="178" width="8" height="8" stroke-width="1"/>
    <rect x="262" y="196" width="8" height="8" stroke-width="1"/>
    <path d="M276 146 h34 M276 164 h30 M276 182 h36 M276 200 h28" stroke-width="0.9"/>
    <path d="M258 208 h60 v6 h-60 Z" fill="url(#p0210-4p-shade)" stroke="none"/>
    <!-- 箭头 -->
    <path d="M110 176 H140" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M220 176 H252" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M40 254 Q180 246 320 254" stroke-width="1.2"/>
    <path d="M56 260 q30 -3 60 0 M244 260 q30 -3 60 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0210 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">库存天数表</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">白板上那个 92 天，是算出来的不是猜的</text>
  <text x="180" y="184" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="24" fill="#2a2a2a">92</text>
  <text x="180" y="198" text-anchor="middle" font-size="9" fill="#666">天</text>
  <text x="180" y="284" text-anchor="middle" font-size="9.5" fill="#666">库存 × 热量 ÷ 两人日需 → 取水与食较小值 → 缺口进采购单</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">食品按 8000 千卡/天，水按 6L/天各算一遍</text>
    <text x="64" y="366">低于 90 天或品类见底，缺口自动进采购单</text>
    <text x="64" y="396">4 月和 10 月轮换日，提前两周列好换水换罐清单</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA + KitchenOwl · 数据出口：sensor.food_days + 采购清单</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：TomBursch/kitchenowl · custom-components/grocy</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

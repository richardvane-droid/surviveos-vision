  <text x="248" y="184" font-size="8" fill="#666">除湿机</text>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0402 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">湿度看护联动</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">木头比你更早闻到梅雨</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">SHT30 温湿度 → ESPHome → HA 迟滞阈值 → 除湿机插座 + 推送</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">65% 开、55% 关，中间迟滞不反复启停</text>
    <text x="64" y="366">持续 15 分钟才动作，一阵潮气不误报</text>
    <text x="64" y="396">掉线 1 小时告警，水箱满提醒倒水</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome + HomeAssistant · 数据出口：手机推送 + 每日湿度曲线</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：esphome/esphome</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>

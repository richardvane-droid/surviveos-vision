<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0000-2-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0000-2-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0000-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">日轨调度逻辑 · 流程图</text>
  <!-- 节点框（手绘感由滤镜提供；圆角矩形=步骤，菱形=判断，圆柱=数据源，胶囊=起止） -->
  <g filter="url(#p0000-2-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱 -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断 菱形 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 步骤 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 步骤 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <!-- 阴影：判断框右下 -->
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0000-2-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z" fill="url(#p0000-2-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0000-2-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="175" y="312" width="130" height="30" rx="15"/>
  </g>
  <!-- 连线（不加滤镜，带箭头） -->
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0000-2-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M196 72 Q160 72 140 72" stroke-dasharray="3 3"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M230 176 V228"/>
    <path d="M390 170 V228"/>
    <path d="M85 170 V228"/>
    <path d="M140 250 H173"/>
    <path d="M230 270 V310"/>
    <path d="M330 250 H287"/>
    <path d="M30 250 Q10 250 10 150 Q10 130 28 130" stroke-dasharray="3 3"/>
  </g>
  <!-- 文字 -->
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">每 60 秒唤醒</text>
    <text x="230" y="74">天文时钟</text><text x="230" y="87" font-size="8.5" fill="#666">日出/日落/方位</text>
    <text x="85" y="147">读当前时刻</text><text x="85" y="161">算太阳高度角</text>
    <text x="230" y="149">高度角 &gt; 0？</text><text x="230" y="162" font-size="8.5" fill="#666">白天 / 夜晚</text>
    <text x="390" y="147">是 → 云台转到</text><text x="390" y="161">对应角度</text>
    <text x="85" y="247">否 → 灯光渐暗</text><text x="85" y="261">进入夜间模式</text>
    <text x="230" y="247">色温 / 亮度</text><text x="230" y="261">按曲线插值</text>
    <text x="390" y="247">发布到 HA</text><text x="390" y="261">sun_position 实体</text>
    <text x="240" y="331">灯光 + 云台同步更新</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="216" y="200">否/是</text><text x="70" y="200">否</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0000-2</text>
</svg>

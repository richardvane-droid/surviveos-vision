<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0104-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0104-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0104-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0104-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：红按钮 + 拍照亭（左） → 宝丽来相片（中） → 麻绳夹子（右） -->
    <!-- 拍照亭木盒 -->
    <rect x="40" y="150" width="64" height="70" rx="3" stroke-width="1.5"/>
    <circle cx="72" cy="168" r="7" stroke-width="1.4"/>
    <circle cx="72" cy="168" r="3" stroke-width="0.9"/>
    <rect x="50" y="184" width="44" height="14" rx="1" stroke-width="1"/>
    <rect x="52" y="186" width="40" height="10" fill="url(#p0104-3p-dots)" stroke="none"/>
    <path d="M50 208 h44" stroke-width="1.2"/>
    <path d="M54 210 h36" stroke-width="0.6"/>
    <!-- 大红按钮（盒顶） -->
    <path d="M60 150 v-6 a12 5 0 0 1 24 0 v6" stroke-width="1.4"/>
    <ellipse cx="72" cy="144" rx="12" ry="5" stroke-width="1.4"/>
    <ellipse cx="72" cy="140" rx="8" ry="3.5" stroke-width="1.2"/>
    <path d="M64 140 v4 a8 3.5 0 0 0 16 0 v-4" stroke-width="1"/>
    <path d="M60 128 l4 4 M72 124 v6 M84 128 l-4 4" stroke-width="1"/>
    <!-- 宝丽来相片（中） -->
    <rect x="146" y="132" width="66" height="82" rx="2" stroke-width="1.5" transform="rotate(-6 179 173)"/>
    <rect x="152" y="138" width="54" height="54" stroke-width="0.9" transform="rotate(-6 179 173)"/>
    <rect x="153" y="139" width="52" height="52" fill="url(#p0104-3p-dots)" stroke="none" transform="rotate(-6 179 173)"/>
    <circle cx="171" cy="160" r="6" stroke-width="0.9" transform="rotate(-6 179 173)"/>
    <circle cx="189" cy="162" r="6" stroke-width="0.9" transform="rotate(-6 179 173)"/>
    <path d="M160 190 q11 -18 22 0 M178 190 q11 -18 22 0" stroke-width="0.9" transform="rotate(-6 179 173)"/>
    <path d="M160 204 h20 M186 204 h14" stroke-width="0.7" transform="rotate(-6 179 173)"/>
    <!-- 麻绳 + 夹子 + 相片（右） -->
    <path d="M244 132 q40 18 84 -4" stroke-width="1.8"/>
    <path d="M250 136 l2 -3 M262 141 l2 -3 M274 143 l2 -3 M286 143 l2 -3 M298 140 l2 -3 M310 136 l2 -3" stroke-width="0.6"/>
    <path d="M280 139 v10 M276 149 h8 v12 h-8 Z" stroke-width="1.3"/>
    <rect x="277" y="150" width="6" height="10" fill="url(#p0104-3p-shade)" stroke="none"/>
    <rect x="258" y="158" width="44" height="54" rx="1.5" stroke-width="1.4"/>
    <rect x="262" y="162" width="36" height="36" stroke-width="0.8"/>
    <rect x="263" y="163" width="34" height="34" fill="url(#p0104-3p-dots)" stroke="none"/>
    <path d="M266 204 h20" stroke-width="0.7"/>
    <path d="M306 190 h10 v10 h-10 Z M308 192 h2 v2 h-2 Z M312 192 h2 v2 h-2 Z M308 196 h2 v2 h-2 Z M312 196 h2 v2 h-2 Z" stroke-width="0.7"/>
    <!-- 箭头 -->
    <path d="M110 178 Q126 176 140 174" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M216 178 Q232 176 250 176" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地平线 -->
    <path d="M40 256 Q180 248 320 256" stroke-width="1.2"/>
    <path d="M44 260 q40 -3 80 0 M236 260 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性行勾选圈 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <!-- 文字层 -->
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0104 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">拍了就挂</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">按一下红按钮，二十秒后自己夹上墙</text>
  <text x="72" y="234" text-anchor="middle" font-size="8.5" fill="#666">红按钮 · 3 秒倒计时</text>
  <text x="180" y="234" text-anchor="middle" font-size="8.5" fill="#666">白边 + 日期烫印</text>
  <text x="284" y="234" text-anchor="middle" font-size="8.5" fill="#666">下排空夹 · 扫码取原片</text>
  <text x="180" y="290" text-anchor="middle" font-size="9.5" fill="#666">按钮 → 倒计时拍照 → 套边框 → 原片存相册 → 打印出片</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">宝丽来白边 + 日期烫印，和拍立得一个风格</text>
    <text x="64" y="366">先把原片存进相册再打印，相纸不够也不丢</text>
    <text x="64" y="396">相纸不足亮黄灯提示，扫码就能带走原片</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：树莓派 pibooth · 数据出口：Immich 客人相册 / 打印计数</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：pibooth/pibooth · PhotoboothProject/photobooth</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0306-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0306-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0306-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0306-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：气压表（降） → 头顶的雨云 → 家：天窗帘关 + 浇灌停 + 收衣服 -->
    <!-- 气压表 -->
    <circle cx="70" cy="196" r="30" stroke-width="1.6"/>
    <circle cx="70" cy="196" r="25" stroke-width="0.6"/>
    <path d="M50 176 l3 3 M90 176 l-3 3 M70 168 v4 M44 196 h4 M96 196 h-4" stroke-width="1"/>
    <path d="M70 196 L52 210" stroke-width="1.6"/>
    <circle cx="70" cy="196" r="2.5" stroke-width="1"/>
    <path d="M86 184 a20 20 0 0 1 -6 26" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="M80 210 l-4 1 l3 -4" stroke-width="1"/>
    <path d="M60 236 h20 v6 h-20 Z" stroke-width="1"/>
    <!-- 雨云 -->
    <path d="M150 156 a14 14 0 0 1 26 -8 a12 12 0 0 1 22 6 a10 10 0 0 1 -2 20 h-46 a9 9 0 0 1 0 -18 Z" stroke-width="1.6"/>
    <path d="M156 160 a10 10 0 0 1 18 -6" stroke-width="0.6"/>
    <path d="M154 166 h40 v6 h-40 Z" fill="url(#p0306-3p-shade)" stroke="none"/>
    <path d="M158 184 l-3 8 M170 184 l-3 8 M182 184 l-3 8 M194 184 l-3 8 M164 198 l-3 8 M176 198 l-3 8 M188 198 l-3 8" stroke-width="1"/>
    <!-- 房子 -->
    <path d="M234 210 l40 -30 l40 30 v40 h-80 Z" stroke-width="1.6"/>
    <path d="M226 212 l48 -38 l48 38" stroke-width="1.2"/>
    <!-- 天窗 + 帘 -->
    <path d="M254 200 l10 -8 l12 8 l-10 8 Z" stroke-width="1"/>
    <path d="M256 200 l8 -6 l10 6 l-8 6 Z" fill="url(#p0306-3p-shade)" stroke="none"/>
    <!-- 门 + 收衣服 -->
    <path d="M262 250 v-20 h14 v20" stroke-width="1"/>
    <path d="M290 232 h20 M300 232 v-6 M292 236 l-2 12 h20 l-2 -12 M296 232 l4 -3 l4 3" stroke-width="1"/>
    <!-- 喷头 停 -->
    <path d="M226 246 h12 M232 246 v-8 M228 238 h8" stroke-width="1"/>
    <path d="M226 232 l12 12" stroke-width="1.2"/>
    <circle cx="232" cy="238" r="7" stroke-width="0.9"/>
    <!-- 箭头 -->
    <path d="M100 180 Q120 166 144 164" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M144 164 l-4 -3 l0 5" stroke-width="1"/>
    <path d="M204 176 Q222 184 236 192" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M236 192 l-5 0 l2 -4" stroke-width="1"/>

    <!-- 地面线 -->
    <path d="M40 268 Q180 262 320 268" stroke-width="1.2"/>
    <path d="M44 272 q40 -3 80 0 M236 272 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0306 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">降雨预警器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">气压计感受到的是你家头顶这片云</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">气压降 + 湿度升 → 预警 → 停浇灌 · 关帘 · 收衣服 → 翻斗确认</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">Zambretti 航海预报法，本地算不用联网</text>
    <text x="64" y="366">预警即暂停 0602 浇灌、关天窗帘、推送收衣服</text>
    <text x="64" y="396">雨量筒翻斗确认，连续 2 次误报自动收紧阈值</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HA 模板传感器 · 数据出口：手机推送 + 0602 浇灌 + 天窗帘</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：3KUdelta/Solar_WiFi_Weather_Station</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

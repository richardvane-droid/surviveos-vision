    <path d="M316 108 l28 -13 l-27 9 Z" stroke-width="1.1"/>
    <circle cx="317" cy="107" r="2" stroke-width="0.9"/>
    <path d="M328 100 l26 -12 l-25 8 Z" stroke-width="1.1"/>
    <circle cx="329" cy="99" r="2" stroke-width="0.9"/>
    <path d="M317 106 l27 -13 l-26 10 Z" fill="url(#p0203-2-shade)" stroke="none"/>
    <!-- ⑥ 玻璃表镜 + 黄铜圈 -->
    <ellipse cx="371" cy="62" rx="40" ry="14" stroke-width="1.5"/>
    <ellipse cx="371" cy="62" rx="34" ry="11.5" stroke-width="0.9"/>
    <path d="M331 62 v4 a40 14 0 0 0 80 0 v-4" stroke-width="1.1"/>
    <path d="M333 64 a40 14 0 0 0 76 0 v3 a40 14 0 0 1 -76 0 Z" fill="url(#p0203-2-shade)" stroke="none"/>
    <path d="M351 56 l14 -6 M357 58 l16 -7" stroke-width="0.6"/>
    <ellipse cx="371" cy="62" rx="34" ry="11.5" fill="url(#p0203-2-dots)" stroke="none" fill-opacity="0.5"/>
  </g>
  <!-- 引线 + 编号 -->
  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M153 300 H200"/><path d="M143 256 H100"/><path d="M241 196 H280"/><path d="M243 146 H226"/><path d="M344 96 H400"/><path d="M411 62 H440"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="210" cy="300" r="8"/><circle cx="90" cy="256" r="8"/><circle cx="290" cy="196" r="8"/><circle cx="216" cy="146" r="8"/><circle cx="410" cy="96" r="8"/><circle cx="450" cy="62" r="8"/>
    </g>
    <text x="210" y="303.5">1</text><text x="90" y="259.5">2</text><text x="290" y="199.5">3</text><text x="216" y="149.5">4</text><text x="410" y="99.5">5</text><text x="450" y="65.5">6</text>
  </g>
  <!-- 图例 -->
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">指针温湿度表盘 · 爆炸图</text>
    <text x="16" y="52">1 黄铜表壳（后盖 + 挂孔）</text>
    <text x="16" y="68">2 ESP32 主板（I²C 接 4 探头）</text>
    <text x="16" y="84">3 X27 微型步进表针电机 ×2</text>
    <text x="16" y="100">4 表盘面 Φ120（45~65% 绿区）</text>
    <text x="16" y="116">5 温度 / 湿度双指针</text>
    <text x="16" y="132">6 玻璃表镜 + 黄铜圈</text>
  </g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0203-2</text>
</svg>

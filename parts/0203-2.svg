    <ellipse cx="279" cy="146" rx="36" ry="13" stroke-width="1.5"/>
    <ellipse cx="279" cy="146" rx="30" ry="10.5" stroke-width="0.6"/>
    <path d="M262 137 a30 10.5 0 0 1 34 0" stroke-width="2.2"/>
    <path d="M249 146 l3 0 M309 146 l-3 0 M279 136 v2 M279 156 v-2 M256 141 l3 1 M302 141 l-3 1 M256 151 l3 -1 M302 151 l-3 -1" stroke-width="0.8"/>
    <circle cx="270" cy="147" r="1.4" stroke-width="0.8"/><circle cx="288" cy="145" r="1.4" stroke-width="0.8"/>
    <path d="M245 148 a36 13 0 0 0 68 0 v3 a36 13 0 0 1 -68 0 Z" fill="url(#p0203-2-shade)" stroke="none"/>

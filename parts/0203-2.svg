    <path d="M71 306 a42 15 0 0 0 80 0" stroke-width="0.7"/>
    <path d="M73 312 a40 13 0 0 0 76 0 v-6 a40 13 0 0 1 -76 0 Z" fill="url(#p0203-2-shade)" stroke="none"/>
    <ellipse cx="111" cy="300" rx="36" ry="12" stroke-width="0.7"/>
    <path d="M111 288 v-5 M108 286 h6" stroke-width="0.9"/>
    <path d="M111 301 m-3 0 a3 1.2 0 1 0 6 0 a3 1.2 0 1 0 -6 0" stroke-width="0.8"/>
    <!-- ② ESP32 主板 -->
    <path d="M143 258 l16 -9 h32 l-16 9 Z" stroke-width="1.4"/>
    <path d="M144 257 l15 -8 h30 l-15 8 Z" stroke="none" fill="none"/>
    <path d="M154 254 l6 -3 l6 3 l-6 3 Z" stroke-width="0.9"/>
    <path d="M155 254 l5 -3 l5 3 l-5 3 Z" fill="url(#p0203-2-shade2)" stroke="none"/>
    <path d="M170 250 l2 -1 M173 252 l2 -1 M176 254 l2 -1 M179 256 l2 -1" stroke-width="1"/>
    <path d="M183 250 l3 -3 l2 3 l3 -3" stroke-width="0.7"/>
    <path d="M143 258 v3 h32 v-3" stroke-width="0.9"/>
    <!-- ③ X27 微型步进表针电机 ×2 -->
    <ellipse cx="214" cy="204" rx="7" ry="3" stroke-width="1.2"/>
    <path d="M207 204 v8 a7 3 0 0 0 14 0 v-8" stroke-width="1.2"/>
    <path d="M214 201 v-12 M212 189 h4" stroke-width="1"/>
    <ellipse cx="232" cy="196" rx="7" ry="3" stroke-width="1.2"/>
    <path d="M225 196 v8 a7 3 0 0 0 14 0 v-8" stroke-width="1.2"/>
    <path d="M232 193 v-12 M230 181 h4" stroke-width="1"/>
    <path d="M208 209 a7 3 0 0 0 12 2 v2 a7 3 0 0 1 -12 -2 Z M226 201 a7 3 0 0 0 12 2 v2 a7 3 0 0 1 -12 -2 Z" fill="url(#p0203-2-shade)" stroke="none"/>
    <path d="M211 213 l-3 4 M235 205 l3 4" stroke-width="0.6"/>

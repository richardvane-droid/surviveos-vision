<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0104-3-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0104-3-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0104-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">拍了就挂 · 流程图</text>
  <g filter="url(#p0104-3-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊：按下红按钮 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 步骤：倒计时取景 -->
    <rect x="175" y="49" width="110" height="40" rx="6"/>
    <rect x="177" y="51" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 步骤：套边框 -->
    <rect x="330" y="49" width="120" height="40" rx="6"/>
    <rect x="332" y="51" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 数据源 圆柱：Immich 木屋相册 -->
    <path d="M356 130 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="390" cy="130" rx="34" ry="6"/>
    <!-- 判断 菱形：相纸充足？ -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 步骤 左：打印 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0104-3-shade)" stroke="none"/>
    <path d="M179 91 h106 v3 h-106 Z M334 91 h116 v3 h-116 Z M34 172 h106 v3 h-106 Z" fill="url(#p0104-3-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0104-3-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="175" y="312" width="130" height="30" rx="15"/>
  </g>
  <!-- 连线 -->
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0104-3-arrow)" stroke-linecap="round">
    <path d="M140 69 H173"/>
    <path d="M285 69 H328"/>
    <path d="M390 89 V122"/>
    <path d="M356 150 H290"/>
    <path d="M172 152 H140"/>
    <path d="M230 176 V228"/>
    <path d="M85 170 V228"/>
    <path d="M390 174 V228" stroke-dasharray="3 3"/>
    <path d="M85 270 V327 H173"/>
    <path d="M285 250 H328" stroke-dasharray="3 3"/>
    <path d="M390 270 V327 H307"/>
  </g>
  <!-- 文字 -->
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">按下红按钮</text>
    <text x="230" y="66">3 秒倒计时</text><text x="230" y="80">预览屏取景拍照</text>
    <text x="390" y="66">套宝丽来白边</text><text x="390" y="80">烫印日期</text>
    <text x="390" y="150">木屋相册</text><text x="390" y="163" font-size="8.5" fill="#666">Immich · 原片先存</text>
    <text x="230" y="149">相纸充足？</text><text x="230" y="162" font-size="8.5" fill="#666">打印机计数</text>
    <text x="85" y="147">是 → 打印 4×6</text><text x="85" y="161">约 20 秒出片</text>
    <text x="85" y="247">自己夹到</text><text x="85" y="261">下排空夹子上</text>
    <text x="230" y="247">否 → 亮黄灯提示</text><text x="230" y="261">照片已存好</text>
    <text x="390" y="247">扫码取原片</text><text x="390" y="261">相册分享链接</text>
    <text x="240" y="331">主人全程不用插手</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="172" y="146">是</text><text x="240" y="196">否</text><text x="300" y="120" text-anchor="middle">先存原片再打印</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0104-3</text>
</svg>

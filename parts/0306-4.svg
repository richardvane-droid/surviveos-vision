<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0306-4-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0306-4-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0306-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">数据上报与年度气候图 · 流程图</text>
  <g filter="url(#p0306-4-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱 -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断 菱形 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 步骤 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0306-4-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z" fill="url(#p0306-4-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0306-4-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="140" y="312" width="200" height="30" rx="15"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0306-4-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M390 170 V228"/>
    <path d="M390 130 V72 H266" stroke-dasharray="3 3"/>
    <path d="M230 176 V205 H85 V228"/>
    <path d="M330 250 H287"/>
    <path d="M230 270 V310"/>
  </g>
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">ESPHome 30 秒上报</text>
    <text x="230" y="74">InfluxDB</text><text x="230" y="87" font-size="8.5" fill="#666">长期时序库</text>
    <text x="85" y="147">HA 收到读数</text><text x="85" y="161">短期留 10 天</text>
    <text x="230" y="149">传感器在线？</text><text x="230" y="162" font-size="8.5" fill="#666">10 分钟无数据</text>
    <text x="390" y="147">是 → 10 分钟聚合</text><text x="390" y="161" font-size="8.5" fill="#666">写入 InfluxDB</text>
    <text x="85" y="247">否 → 掉线告警</text><text x="85" y="261">推送检查线路</text>
    <text x="230" y="247">按天聚合</text><text x="230" y="261">最高低温·雨量·风向</text>
    <text x="390" y="247">雨量筒一周没翻斗？</text><text x="390" y="261">提醒清落叶</text>
    <text x="240" y="331">年底生成年度气候图 → 0211 大屏</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="240" y="195">否</text><text x="300" y="68">写入</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0306-4</text>
</svg>

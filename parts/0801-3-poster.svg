  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">扫码入库</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">一个箱子一张照片，建档只做一次</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">扫箱号 → 拍俯视照 → 逐件录名（可语音）→ 区域 / 格位 / 箱 / 层</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">箱号码只编码编号，换内容不用换标签</text>
    <text x="64" y="366">先看照片再决定开不开箱</text>
    <text x="64" y="396">相似物品自动提示，避免重复建档</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：Homebox（N100 小主机）· 数据出口：物品记录 + 地图坐标</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：sysadminsmedia/homebox</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0602-3p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0602-3p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0602-3p-shade2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a4a4a" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="4" y2="2" stroke="#4a4a4a" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="p0602-3p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>

  <g filter="url(#p0602-3p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 左：三传感器 -->
    <path d="M44 122 h22 l-2 8 h-18 Z" stroke-width="1.3"/>
    <path d="M50 130 v18 M60 130 v18 M55 148 l-5 8 M55 148 l5 8" stroke-width="1.1"/>
    <path d="M42 176 h26 l-9 14 h-8 Z" stroke-width="1.3"/>
    <path d="M47 190 l8 6 l8 -6" stroke-width="1"/>
    <path d="M44 216 h22 v26 h-22 Z" stroke-width="1.3"/>
    <path d="M44 230 h22" stroke-width="0.8"/>
    <rect x="46" y="230" width="18" height="10" fill="url(#p0602-3p-dots)" stroke="none"/>
    <!-- 中：ESP32 芯片 -->
    <rect x="148" y="150" width="64" height="48" rx="5" stroke-width="1.6"/>
    <rect x="156" y="158" width="48" height="32" rx="3" stroke-width="0.7"/>
    <path d="M140 160 h8 M140 170 h8 M140 180 h8 M140 190 h8 M212 160 h8 M212 170 h8 M212 180 h8 M212 190 h8" stroke-width="1"/>
    <path d="M158 160 h44 v6 h-44 Z" fill="url(#p0602-3p-shade)" stroke="none"/>
    <path d="M166 176 l6 6 l12 -12" stroke-width="1.6"/>
    <path d="M164 184 h32" stroke-width="0.6"/>
    <!-- 右：电磁阀 + 滴管 -->
    <path d="M258 154 h60 M258 162 h60" stroke-width="1.4"/>
    <path d="M280 154 v-10 h16 v10" stroke-width="1.3"/>
    <path d="M283 144 v-8 h10 v8" stroke-width="1.1"/>
    <path d="M288 136 v-6" stroke-width="0.9"/>
    <path d="M260 159 h56 v3 h-56 Z" fill="url(#p0602-3p-shade)" stroke="none"/>
    <path d="M288 162 v20" stroke-width="1.2"/>
    <path d="M250 182 h76" stroke-width="1.4"/>
    <path d="M262 190 q-3 5 0 7 q3 -2 0 -7 Z M282 190 q-3 5 0 7 q3 -2 0 -7 Z M302 190 q-3 5 0 7 q3 -2 0 -7 Z M322 190 q-3 5 0 7 q3 -2 0 -7 Z" stroke-width="0.9"/>
    <path d="M254 214 q10 -14 6 -22 M270 214 q4 -12 10 -20 M292 214 q-4 -14 2 -22 M312 214 q6 -12 4 -20" stroke-width="1"/>
    <!-- 箭头：三传感器 → 芯片 → 阀 -->
    <path d="M74 136 Q110 150 140 166" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M74 184 H140" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M74 230 Q110 210 140 186" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M134 170 l6 -3 l1 6" stroke-width="1"/>
    <path d="M228 174 H252" stroke-width="1" stroke-dasharray="3 3"/><path d="M248 170 l5 4 l-5 4" stroke-width="1"/>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0602 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">三传感器灌溉判断</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">三个传感器开会，我只负责看结果</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">土壤 · 雨量 · 水位 → ESP32 三条件与门 → 蒸散量折算分钟 → 开阀</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">含水率低于阈值 + 6 小时无雨 + 罐有水才浇</text>
    <text x="64" y="366">浇多久由前一日蒸散量折算，5~15 分钟封顶</text>
    <text x="64" y="396">锁定凌晨四到六点，断网也在本地照常判断</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome（ESP32 本地）· 数据出口：HomeAssistant 用水记录</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：altmenorg/HAsmartirrigation</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

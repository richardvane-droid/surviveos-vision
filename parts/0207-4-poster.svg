  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">幕布跟色灯</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">画面的颜色，从幕布边上漫出来</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">HDMI 分流 → 采集卡 → 边缘 240 段平均色 → 300 颗 LED 实时刷新</text>

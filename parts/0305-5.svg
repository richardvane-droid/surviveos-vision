<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0305-5-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0305-5-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0305-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">耗材管理 · 流程图</text>
  <g filter="url(#p0305-5-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱 -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断 菱形 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 步骤 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0305-5-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z" fill="url(#p0305-5-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0305-5-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="165" y="312" width="150" height="30" rx="15"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0305-5-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M196 72 Q160 72 140 72" stroke-dasharray="3 3"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M390 170 V228"/>
    <path d="M230 176 V205 H85 V228"/>
    <path d="M140 250 H173"/>
    <path d="M330 250 H287"/>
    <path d="M230 270 V310"/>
    <path d="M390 130 V72 H266" stroke-dasharray="3 3"/>
  </g>
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">新卷登记 Spoolman</text>
    <text x="230" y="74">Spoolman 库</text><text x="230" y="87" font-size="8.5" fill="#666">颜色·材质·克数</text>
    <text x="85" y="147">打印结束</text><text x="85" y="161">读切片预计用量</text>
    <text x="230" y="149">AMS 槽位匹配？</text><text x="230" y="162" font-size="8.5" fill="#666">对应是哪一卷</text>
    <text x="390" y="147">是 → 扣减剩余克数</text><text x="390" y="161" font-size="8.5" fill="#666">回写 Spoolman</text>
    <text x="85" y="247">否 → 推送“请选卷”</text><text x="85" y="261">人工指定后再扣</text>
    <text x="230" y="247">剩余 &lt;150g？</text><text x="230" y="261">推送补货提醒</text>
    <text x="390" y="247">库存 &gt;8 卷？</text><text x="390" y="261">提示“先用完再买”</text>
    <text x="240" y="331">每月称重一次校准数据</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="240" y="195">否</text><text x="300" y="68">回写</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0305-5</text>
</svg>

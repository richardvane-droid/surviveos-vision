  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">炉温 &gt; 40℃ 生火中</text>
    <text x="230" y="66">读炉侧 + 远角温度</text><text x="230" y="80">算温差 ΔT</text>

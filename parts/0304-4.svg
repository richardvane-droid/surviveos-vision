<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0304-4-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0304-4-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0304-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">充放电与负载调度 · 流程图</text>
  <g filter="url(#p0304-4-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱：储能状态 -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤：算净功率 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断 菱形 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 是 → 关一路 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0304-4-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z" fill="url(#p0304-4-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0304-4-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="165" y="312" width="150" height="30" rx="15"/>
  </g>
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0304-4-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M196 72 Q160 72 140 72" stroke-dasharray="3 3"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M230 176 V228"/>
    <path d="M390 170 V228"/>
    <path d="M175 250 H142"/>
    <path d="M230 270 V310"/>
    <path d="M390 270 V327 H317"/>
    <path d="M30 250 Q10 250 10 150 Q10 130 28 130" stroke-dasharray="3 3"/>
  </g>
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">每 5 分钟读储能状态</text>
    <text x="230" y="74">储能状态</text><text x="230" y="87" font-size="8.5" fill="#666">SOC · 光伏 W</text>
    <text x="85" y="147">算净功率</text><text x="85" y="161">光伏输入 − 各口负载</text>
    <text x="230" y="149">SOC 跌破阈值？</text><text x="230" y="162" font-size="8.5" fill="#666">80 / 50 / 30 / 20%</text>
    <text x="390" y="147">是 → 按优先级关一路</text><text x="390" y="161" font-size="8.5" fill="#666">楼下充电 › 打印机 › 气象站</text>
    <text x="85" y="247">回升 10% 再恢复</text><text x="85" y="261">避免反复开关</text>
    <text x="230" y="247">否 → 光伏 &gt; 负载时</text><text x="230" y="261">逐级恢复输出口</text>
    <text x="390" y="247">&lt;20% 只留串灯气象站</text><text x="390" y="261">推送“今晚省着用”</text>
    <text x="240" y="331">每日发电量推送 0211 大屏</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="240" y="200">否</text><text x="158" y="242">滞回</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0304-4</text>
</svg>

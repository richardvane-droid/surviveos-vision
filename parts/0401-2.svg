  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">WORX 20V 电池平台与割草四件套 · 爆炸图</text>
  <g font-size="8.5" fill="#444"><text x="16" y="46">1 下区柜充电位排（取下即充，轮着充）</text><text x="16" y="59">2 WORX 20V 大脚板电池 ×2（裸机通用）</text><text x="16" y="72">3 电动打草机（裸机，共用电池）</text><text x="16" y="85">4 手动修枝剪（四件套里唯一不带电的）</text><text x="16" y="98">5 吹叶机 WU231.9（8.6～11.6 m³/min）</text><text x="16" y="111">6 荧光绿黑字标签 + 型材配件两只分箱</text></g>

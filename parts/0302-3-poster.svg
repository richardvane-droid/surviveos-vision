    <rect x="46" y="122" width="44" height="76" rx="6" stroke-width="1.5"/>
    <rect x="50" y="130" width="36" height="56" rx="2" stroke-width="0.7"/>
    <path d="M56 140 h24 M56 150 h24 M56 160 h16" stroke-width="0.9"/>
    <path d="M52 144 l2 2 l4 -4 M52 154 l2 2 l4 -4" stroke-width="1"/>
    <circle cx="68" cy="192" r="2.5" stroke-width="0.9"/>
    <!-- 清单板（中） -->
    <rect x="132" y="112" width="96" height="112" rx="4" stroke-width="1.6"/>
    <rect x="164" y="104" width="32" height="14" rx="4" stroke-width="1.2"/>
    <rect x="166" y="106" width="28" height="10" fill="url(#p0302-3p-shade)" stroke="none"/>
    <path d="M146 138 h60 M146 158 h60 M146 178 h60 M146 198 h44" stroke-width="0.9"/>
    <circle cx="142" cy="138" r="4" stroke-width="1"/><path d="M140 138 l1.5 1.5 l3 -3" stroke-width="1"/>
    <circle cx="142" cy="158" r="4" stroke-width="1"/><path d="M140 158 l1.5 1.5 l3 -3" stroke-width="1"/>
    <circle cx="142" cy="178" r="4" stroke-width="1"/>
    <circle cx="142" cy="198" r="4" stroke-width="1"/>
    <path d="M212 134 h10 v8 h-10 Z" stroke-width="0.8"/>
    <path d="M212 134 h10 v8 h-10 Z" fill="url(#p0302-3p-dots)" stroke="none"/>
    <!-- 登山包（右） -->
    <path d="M266 150 q0 -16 20 -16 q20 0 20 16 v40 q0 6 -6 6 h-28 q-6 0 -6 -6 Z" stroke-width="1.6"/>

    <path d="M94 160 H126" stroke-width="1" stroke-dasharray="3 3"/><path d="M122 156 l5 4 l-5 4" stroke-width="1"/>
    <path d="M232 168 H258" stroke-width="1" stroke-dasharray="3 3"/><path d="M254 164 l5 4 l-5 4" stroke-width="1"/>

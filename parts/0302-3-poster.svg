    <path d="M266 156 q-6 4 -6 12 v12" stroke-width="0.9"/>
    <circle cx="300" cy="140" r="9" stroke-width="1.3"/><path d="M296 140 l3 3 l6 -7" stroke-width="1.3"/>
    <!-- 二维码格子（下） -->
    <rect x="142" y="238" width="24" height="24" stroke-width="1.2"/>
    <rect x="145" y="241" width="7" height="7" stroke-width="0.8"/><rect x="156" y="241" width="7" height="7" stroke-width="0.8"/><rect x="145" y="252" width="7" height="7" stroke-width="0.8"/>
    <path d="M156 252 h3 v3 h-3 Z M160 256 h3 v3 h-3 Z" fill="#3d3d3d" stroke="none"/>

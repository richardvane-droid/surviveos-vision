    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0302 · L3</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">出发清单核对器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">空格子就是你忘带的东西</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">选线路 → LighterPack 清单 → 扫格子二维码 → 缺件提示 + 总重</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">三条线路各存一份清单，重量自动累加</text>
    <text x="64" y="366">格子贴二维码，扫一下知道气罐剩几罐</text>
    <text x="64" y="396">墙上手写板同步，断网照样核对</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：自部署 LighterPack + Homebox · 数据出口：HA 推送</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：galenmaly/lighterpack · sysadminsmedia/homebox</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

    <rect x="42" y="126" width="62" height="58" rx="4" stroke-width="1.6"/>
    <path d="M42 140 H104" stroke-width="1.2"/>
    <path d="M54 126 v-8 M92 126 v-8" stroke-width="1.4"/>
    <path d="M50 150 h8 M64 150 h8 M78 150 h8 M92 150 h6 M50 162 h8 M64 162 h8 M78 162 h8 M92 162 h6 M50 174 h8 M64 174 h8" stroke-width="0.9"/>
    <rect x="62" y="158" width="12" height="8" fill="url(#p0601-4p-shade)" stroke="none"/>
    <!-- 三区植物（中）：草 / 树 / 花 -->
    <path d="M140 200 q22 -2 80 0" stroke-width="1"/>
    <path d="M150 200 q-6 -18 -2 -36 M154 200 q0 -18 6 -32 M158 200 q6 -14 12 -26" stroke-width="1.1"/>
    <ellipse cx="146" cy="160" rx="3" ry="8" transform="rotate(-8 146 160)" fill="url(#p0601-4p-shade)" stroke="none"/>

    <path d="M168 168 q-4 -12 8 -14 q8 -10 18 0 q10 2 4 12 q-2 8 -14 6 q-10 4 -16 -4 Z" stroke-width="1.3"/>
    <path d="M206 200 v-24 M206 176 q-8 -4 -8 -12 q8 -4 8 4 q0 -8 8 -4 q0 8 -8 12 Z" stroke-width="1.1"/>
    <circle cx="206" cy="166" r="3" stroke-width="0.9"/>
    <path d="M200 190 q4 -2 6 2" stroke-width="0.8"/>
    <!-- 天气云 + 雨（中上） -->
    <path d="M160 116 q-10 -2 -8 -10 q2 -8 12 -6 q4 -10 16 -6 q10 -2 12 8 q8 2 4 10 q-4 6 -12 4 Z" stroke-width="1.3"/>
    <path d="M166 124 l-3 6 M176 124 l-3 6 M186 124 l-3 6" stroke-width="0.9"/>

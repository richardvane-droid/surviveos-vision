    <rect x="262" y="132" width="36" height="60" rx="5" stroke-width="1.5"/>
    <rect x="266" y="140" width="28" height="42" rx="2" stroke-width="0.6"/>
    <path d="M270 150 h20 M270 158 h20 M270 166 h12" stroke-width="0.9"/>
    <rect x="268" y="146" width="24" height="10" fill="url(#p0601-4p-shade)" stroke="none"/>
    <path d="M298 140 q10 -6 6 -16" stroke-width="0.8"/>
    <path d="M304 128 l6 -4 l2 6" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M110 160 H138" stroke-width="1" stroke-dasharray="3 3"/><path d="M134 156 l5 4 l-5 4" stroke-width="1"/>
    <path d="M182 134 V150" stroke-width="1" stroke-dasharray="3 3"/><path d="M178 146 l4 5 l4 -5" stroke-width="1"/>
    <path d="M226 164 H256" stroke-width="1" stroke-dasharray="3 3"/><path d="M252 160 l5 4 l-5 4" stroke-width="1"/>
    </g>
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0601 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">分区养护日历</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">该割草的那天，手机比你先知道</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">植物档案 + 气候节点 → 月度任务 → 天气核对 → 手机推送 / 打勾</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">二月底连 3 天无雨才提醒贴地割草</text>
    <text x="64" y="366">草原 / 疏林 / 野花三区各有自己的月份表</text>
    <text x="64" y="396">完成打勾，一年攒成一本草地成长日志</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：HomeAssistant 本地日历 · 数据出口：手机推送 + 成长日志</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：Ecohackerfarm/powerplant</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

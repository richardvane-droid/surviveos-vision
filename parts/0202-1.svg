      <circle cx="180" cy="226" r="7"/><path d="M176 233 h8 v5 h-8 Z"/><path d="M177 227 l2 -3 l2 3 l2 -3" stroke-width="0.7"/>
      <circle cx="210" cy="226" r="7"/><path d="M206 233 h8 v5 h-8 Z"/><path d="M207 227 l2 -3 l2 3 l2 -3" stroke-width="0.7"/>
    </g>

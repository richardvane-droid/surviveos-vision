    <text x="216" y="303.5">1</text><text x="120" y="243.5">2</text><text x="330" y="179.5">3</text><text x="400" y="119.5">4</text><text x="450" y="65.5">5</text>
  </g>
  <!-- 图例 -->
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">天花板灯箱 · 爆炸图</text>

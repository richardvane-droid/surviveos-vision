    <path d="M323 71 h60 v3 h-60 Z" fill="url(#p0202-1-shade)" stroke="none"/>
  </g>
  <!-- 引线 + 编号 -->
  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M162 300 H206"/><path d="M158 240 H130"/><path d="M289 176 H320"/><path d="M354 116 H390"/><path d="M413 62 H440"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="216" cy="300" r="8"/><circle cx="120" cy="240" r="8"/><circle cx="330" cy="176" r="8"/><circle cx="400" cy="116" r="8"/><circle cx="450" cy="62" r="8"/>

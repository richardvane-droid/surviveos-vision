<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0208-3-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0208-3-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <marker id="p0208-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d3d3d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="16" y="30" font-weight="700" font-size="12" fill="#2a2a2a">听音场景 · 流程图</text>
  <g filter="url(#p0208-3-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" stroke-opacity="0.92">
    <!-- 起点 胶囊 -->
    <rect x="30" y="52" width="110" height="34" rx="17"/>
    <!-- 数据源 圆柱：场景配置 -->
    <path d="M196 54 a34 6 0 0 1 68 0 v38 a34 6 0 0 1 -68 0 Z"/><ellipse cx="230" cy="54" rx="34" ry="6"/>
    <!-- 步骤：灯光 -->
    <rect x="30" y="130" width="110" height="40" rx="6"/>
    <rect x="32" y="132" width="106" height="36" rx="5" stroke-width="0.5"/>
    <!-- 判断：音源 -->
    <path d="M230 128 l58 24 l-58 24 l-58 -24 Z"/>
    <!-- 步骤：黑胶通道 -->
    <rect x="330" y="130" width="120" height="40" rx="6"/>
    <rect x="332" y="132" width="116" height="36" rx="5" stroke-width="0.5"/>
    <!-- 底行 -->
    <rect x="30" y="230" width="110" height="40" rx="6"/>
    <rect x="175" y="230" width="110" height="40" rx="6"/>
    <rect x="330" y="230" width="120" height="40" rx="6"/>
    <!-- 阴影 -->
    <path d="M232 176 l56 -24 l4 2 l-58 26 Z" fill="url(#p0208-3-shade)" stroke="none"/>
    <path d="M334 172 h116 v3 h-116 Z" fill="url(#p0208-3-shade)" stroke="none"/>
    <path d="M34 272 h106 v3 h-106 Z M179 272 h106 v3 h-106 Z M334 272 h116 v3 h-116 Z" fill="url(#p0208-3-shade)" stroke="none"/>
    <!-- 终点 -->
    <rect x="175" y="312" width="130" height="30" rx="15"/>
  </g>
  <!-- 连线 -->
  <g stroke="#3d3d3d" stroke-width="1.2" fill="none" marker-end="url(#p0208-3-arrow)" stroke-linecap="round">
    <path d="M85 86 V128"/>
    <path d="M196 72 Q160 72 140 72" stroke-dasharray="3 3"/>
    <path d="M140 150 H170"/>
    <path d="M288 152 H328"/>
    <path d="M230 176 V228"/>
    <path d="M390 170 V228"/>
    <path d="M85 170 V228"/>
    <path d="M285 250 H328"/>
    <path d="M390 270 V327 H307"/>
    <path d="M85 270 V327 H173"/>
    <path d="M240 342 V352 H12 V69 H28" stroke-dasharray="3 3"/>
  </g>
  <!-- 文字 -->
  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">按下听音按钮</text>
    <text x="230" y="74">场景配置</text><text x="230" y="87" font-size="8.5" fill="#666">源 / 灯光 / 预热</text>
    <text x="85" y="147">0201 灯光只打</text><text x="85" y="161">皮椅 + 唱盘</text>
    <text x="230" y="149">音源＝黑胶？</text><text x="230" y="162" font-size="8.5" fill="#666">黑胶 / 流媒体</text>
    <text x="390" y="147">是 → 切唱放通道</text><text x="390" y="161">唱盘电机启动</text>
    <text x="85" y="247">0203 新风静音档</text><text x="85" y="261">0207 主声道让位</text>
    <text x="230" y="247">否 → moOde 播放</text><text x="230" y="261">本地曲库 / 电台</text>
    <text x="390" y="247">胆机上电预热</text><text x="390" y="261">静音 60 秒</text>
    <text x="240" y="331">解除静音，唱针落下</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="305" y="146">是</text><text x="216" y="200">否</text><text x="100" y="346">再按一次 · 流程倒放</text></g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0208-3</text>
</svg>

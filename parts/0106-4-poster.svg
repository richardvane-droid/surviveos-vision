<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0106-4p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="16" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0106-4p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0106-4p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <g filter="url(#p0106-4p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 炉子 + 热气 -->
    <rect x="40" y="170" width="54" height="44" rx="3" stroke-width="1.6"/>
    <rect x="47" y="179" width="40" height="26" rx="2" stroke-width="1"/>
    <rect x="49" y="192" width="36" height="11" fill="url(#p0106-4p-shade)" stroke="none"/>
    <path d="M46 214 v8 M88 214 v8 M60 170 v-18 M74 170 v-18" stroke-width="1.4"/>
    <path d="M50 160 q4 -8 0 -16 q-4 -8 0 -16 M100 160 q4 -8 0 -16 q-4 -8 0 -16 M110 176 q4 -8 0 -16" stroke-width="0.9"/>
    <!-- 风扇 -->
    <circle cx="180" cy="180" r="30" stroke-width="1.6"/>
    <circle cx="180" cy="180" r="5" stroke-width="1.2"/>
    <path d="M180 175 q-18 -18 -4 -28 q14 6 4 28 Z" stroke-width="1.2"/>
    <path d="M184 183 q24 -6 24 10 q-14 8 -24 -10 Z" stroke-width="1.2"/>
    <path d="M176 183 q-24 6 -24 10 q14 8 24 -10 Z" stroke-width="1.2"/>
    <path d="M178 177 q-14 -16 -4 -24 q10 6 4 24 Z" fill="url(#p0106-4p-shade)" stroke="none"/>
    <path d="M180 210 v18 M166 228 h28" stroke-width="1.4"/>
    <path d="M214 170 h14 M216 180 h18 M214 190 h14" stroke-width="0.9" stroke-dasharray="2 2"/>
    <!-- 远角 + 温度计 -->
    <path d="M250 130 v100 h74" stroke-width="1.4"/>
    <path d="M254 136 l8 -6 M254 150 l8 -6 M254 164 l8 -6 M258 226 l6 -8 M272 226 l6 -8" stroke-width="0.6"/>
    <rect x="286" y="146" width="12" height="52" rx="6" stroke-width="1.4"/>
    <circle cx="292" cy="206" r="9" stroke-width="1.4"/>
    <path d="M289 176 v22 a3 3 0 0 0 6 0 v-22 Z" fill="url(#p0106-4p-shade)" stroke="none"/>
    <path d="M300 156 h4 M300 166 h4 M300 176 h4 M300 186 h4" stroke-width="0.8"/>
    <!-- 箭头 -->
    <path d="M100 190 Q120 176 146 180" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M232 180 Q256 178 280 172" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地面 -->
    <path d="M36 238 Q180 232 324 238" stroke-width="1.2"/>
    <path d="M44 242 q40 -3 80 0 M232 242 q40 -3 80 0" stroke-width="0.6"/>
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0106 · L4</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">炉热循环风扇</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">炉边 30 度角落 16 度？让风扇把温差抹平</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">炉侧温度 − 远角温度 = ΔT → PID 算转速 → PWM 风扇把热推到角落</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">两点温差大于 2℃ 才转，温差越大转得越快</text>
    <text x="64" y="366">夜里 23 点后转速上限 40%，睡觉听不见</text>
    <text x="64" y="396">传感器掉线自动固定 30% 运转，不会闷着</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome PID climate · 数据出口：HA 温差曲线 + 风扇占空比</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：patrickcollins12/esphome-fan-controller</text>
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

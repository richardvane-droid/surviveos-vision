  <g font-size="10.5" fill="#2a2a2a" text-anchor="middle">
    <text x="85" y="73">每天 04:00 唤醒</text>
    <text x="230" y="71.5">三传感器</text>
    <text x="230" y="84.5" font-size="8.5" fill="#666">土壤·雨量·水位</text>
    <text x="85" y="147.5">读三区含水率</text>
    <text x="85" y="161">昨日雨量 · 罐水位</text>
    <text x="230" y="149.5">三条件都满足？</text>
    <text x="230" y="162.5" font-size="8.5" fill="#666">阈值·无雨·有水</text>

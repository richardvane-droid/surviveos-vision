    <text x="390" y="161">折算各区分钟数</text>
    <text x="85" y="247.5">否 → 今天不浇</text>
    <text x="85" y="261">只记含水率曲线</text>
    <text x="230" y="247.5">关阀 → 写入 HA</text>
    <text x="230" y="261">用水量 + 水源</text>
    <text x="390" y="247.5">开阀 5~15 分钟</text>
    <text x="390" y="261">草原→疏林→点缀轮灌</text>
    <text x="240" y="331">06:00 前结束 · 红按钮随时手动浇 5 分钟</text>
  </g>
  <g font-size="8.5" fill="#666"><text x="310" y="146">是</text><text x="236" y="200">否</text></g>

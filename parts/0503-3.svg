  <g stroke="#5a5a5a" stroke-width="0.8" fill="none" stroke-dasharray="2 3">
    <path d="M150 300 H206"/><path d="M150 226 H116"/><path d="M270 176 H300"/><path d="M354 112 H378"/><path d="M410 60 H450"/>
  </g>
  <g font-size="10" fill="#2a2a2a" text-anchor="middle">
    <g stroke="#3d3d3d" stroke-width="1" fill="#f7f4ee">
      <circle cx="216" cy="300" r="8"/><circle cx="106" cy="226" r="8"/><circle cx="310" cy="176" r="8"/><circle cx="388" cy="112" r="8"/><circle cx="460" cy="60" r="8"/>
    </g>
    <text x="216" y="303.5">1</text><text x="106" y="229.5">2</text><text x="310" y="179.5">3</text><text x="388" y="115.5">4</text><text x="460" y="63.5">5</text>
  </g>
  <g font-size="10.5" fill="#2a2a2a">
    <text x="16" y="34" font-weight="700" font-size="12">陶缸小水景 · 爆炸图</text>
    <text x="16" y="52">1 旧陶缸 φ60cm（缸沿溢流缺口）</text>
    <text x="16" y="68">2 塘泥层 10cm（种菖蒲）</text>
    <text x="16" y="84">3 菖蒲丛（地下茎越冬）</text>
    <text x="16" y="100">4 水体 + 两条本地黑鱼</text>
    <text x="16" y="116">5 浮叶（落叶就让它漂着）</text>
  </g>
  <text x="464" y="350" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0503-3</text>
</svg>

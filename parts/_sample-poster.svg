<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="p0000-2p-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p0000-2p-shade" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6b6b6b" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>
    <pattern id="p0000-2p-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#7a7a7a"/>
    </pattern>
  </defs>
  <!-- 海报边框（双线，手绘） -->
  <g filter="url(#p0000-2p-pencil)" stroke="#3d3d3d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="332" height="452" rx="4" stroke-width="1.6"/>
    <rect x="19" y="19" width="322" height="442" rx="3" stroke-width="0.7"/>
    <!-- 顶部小字条 -->
    <path d="M30 44 H330" stroke-width="0.8"/>
    <!-- 主视觉：一条日轨弧线 + 太阳 + 云台灯 + 时钟 -->
    <path d="M60 230 Q180 90 300 230" stroke-width="1.6" stroke-dasharray="6 5"/>
    <circle cx="180" cy="128" r="22" stroke-width="1.6"/>
    <circle cx="180" cy="128" r="22" fill="url(#p0000-2p-dots)" stroke="none"/>
    <path d="M180 96 v-10 M180 160 v10 M148 128 h-10 M212 128 h10 M157 105 l-7 -7 M203 151 l7 7 M203 105 l7 -7 M157 151 l-7 7" stroke-width="1.4"/>
    <!-- 时钟（左） -->
    <circle cx="70" cy="240" r="20" stroke-width="1.4"/>
    <path d="M70 240 V226 M70 240 L80 246" stroke-width="1.6"/>
    <path d="M70 222 v3 M70 258 v-3 M52 240 h3 M88 240 h-3" stroke-width="1"/>
    <!-- 云台灯（右） -->
    <rect x="266" y="236" width="56" height="20" rx="4" stroke-width="1.4"/>
    <path d="M294 236 v-14 a10 10 0 0 1 20 0" stroke-width="1.3"/>
    <rect x="270" y="246" width="48" height="8" fill="url(#p0000-2p-shade)" stroke="none"/>
    <path d="M286 256 v10 h16 v-10" stroke-width="1.2"/>
    <!-- 箭头：时钟 → 太阳 → 灯 -->
    <path d="M92 232 Q120 190 156 148" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M206 148 Q240 190 268 232" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 地平线 -->
    <path d="M40 270 Q180 262 320 270" stroke-width="1.2"/>
    <path d="M44 274 q40 -3 80 0 M236 274 q40 -3 80 0" stroke-width="0.6"/>
    <!-- 特性行左侧小图标 -->
    <circle cx="48" cy="332" r="7" stroke-width="1.2"/><path d="M45 332 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="362" r="7" stroke-width="1.2"/><path d="M45 362 l2 2 l4 -5" stroke-width="1.2"/>
    <circle cx="48" cy="392" r="7" stroke-width="1.2"/><path d="M45 392 l2 2 l4 -5" stroke-width="1.2"/>
    <!-- 底部信息条 -->
    <path d="M30 420 H330" stroke-width="0.8"/>
  </g>
  <!-- 文字层（不加滤镜） -->
  <text x="30" y="38" font-size="9" fill="#666" letter-spacing="2">SURVIVEOS · LOGIC PRODUCT</text>
  <text x="330" y="38" font-size="9" fill="#666" text-anchor="end">0201 · L1</text>
  <text x="180" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-weight="900" font-size="22" fill="#2a2a2a">日轨调度器</text>
  <text x="180" y="90" text-anchor="middle" font-family="'Long Cang','Kaiti SC',cursive" font-size="13" fill="#b5372b">让地下室的太阳按真太阳的时间表上班</text>
  <text x="180" y="300" text-anchor="middle" font-size="9.5" fill="#666">天文时钟 → 太阳高度角 → 云台角度 + 色温曲线</text>
  <g font-size="11" fill="#2a2a2a">
    <text x="64" y="336">每分钟按杭州经纬度算一次太阳位置</text>
    <text x="64" y="366">四场景（晨光/正午/黄昏/阴天）可一键覆盖</text>
    <text x="64" y="396">全部在 ESP32 本地跑，断网照常升起</text>
  </g>
  <text x="30" y="440" font-size="9" fill="#666">跑在：ESPHome · 数据出口：HomeAssistant sun_position 实体</text>
  <text x="30" y="454" font-size="9" fill="#666">参考实现：basnijholt/adaptive-lighting</text>
  <!-- 印章 -->
  <g transform="rotate(-8 296 108)">
    <rect x="266" y="98" width="60" height="20" rx="3" fill="none" stroke="#b5372b" stroke-width="1.4"/>
    <text x="296" y="112" text-anchor="middle" font-size="9.5" fill="#b5372b" font-weight="700" letter-spacing="1">设想·逻辑</text>
  </g>
</svg>

  <g font-size="8.5" fill="#444"><text x="16" y="46">1 下层加热耗材干燥箱：边烘边打，目标 &lt;15% RH</text><text x="16" y="59">2 腔体顶部 100mm 排风法兰</text><text x="16" y="72">3 活性炭滤棉（3 个月一换）</text><text x="16" y="85">4 12V 静音管道风扇：开打即开，结束延时 10 分钟</text><text x="16" y="98">5 铝箔软管 ≈1.5m，横过天花到天窗边</text><text x="16" y="111">6 天窗边排气口百叶 + 防虫网</text></g>

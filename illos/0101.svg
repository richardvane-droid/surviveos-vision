<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="m0101-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="m0101-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.8"/>
    </pattern>
    <pattern id="m0101-hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1c1c1c" stroke-width="0.6"/>
    </pattern>
  </defs>
  <g filter="url(#m0101-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line + rope ring on floor -->
    <path d="M14 262 Q120 258 200 260 T388 258" stroke-width="1.2"/>
    <path d="M90 258 Q220 280 360 254" stroke-width="1.1" stroke-dasharray="6 3"/>

    <!-- backdrop plank (old pine board) behind, left of pedestal -->
    <path d="M88 96 H142 V248" stroke-width="1.7"/>
    <path d="M90 98 H140 V246" stroke-width="0.9"/>
    <path d="M100 110 q6 40 -2 80 M116 104 q-4 50 4 110 M130 120 q3 30 -2 70" stroke-width="0.8"/>
    <circle cx="115" cy="150" r="10" stroke-width="1.3"/>
    <path d="M108 150 h14 M115 143 v14" stroke-width="1"/>
    <path d="M104 130 h22 M104 172 h22" stroke-width="0.8"/>

    <!-- spotlight fixture hanging from ceiling -->
    <path d="M226 6 V30" stroke-width="1.1"/>
    <path d="M214 30 H238 V48 H214 Z" stroke-width="1.6"/>
    <path d="M216 32 H236" stroke-width="0.9"/>
    <path d="M214 48 H238" stroke-width="1"/>
    <!-- light cone -->
    <path d="M216 50 L168 178 M236 50 L296 170" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M226 54 L228 120 M221 56 L200 130 M231 56 L258 126" stroke-width="0.6" stroke-dasharray="2 4"/>

    <!-- pedestal top surface (tilted) -->
    <path d="M144 196 L262 196 L304 176 L188 176 Z" stroke-width="1.9"/>
    <path d="M146 198 L262 198 L302 178" stroke-width="1"/>
    <!-- pedestal front face -->
    <path d="M144 196 V254 H262 V196" stroke-width="1.9"/>
    <path d="M146 198 V252 H260" stroke-width="1"/>
    <!-- pedestal side face (shadow) -->
    <path d="M262 196 L304 176 V236 L262 254" stroke-width="1.7"/>
    <path d="M264 198 L302 179 V234 L264 252 Z" fill="url(#m0101-hatch)" stroke="none"/>
    <!-- drawer line on front -->
    <path d="M150 232 H256 M150 236 H256" stroke-width="0.9"/>
    <path d="M196 234 h14" stroke-width="1.4"/>
    <!-- wood grain on front -->
    <path d="M156 206 q30 -3 60 0 q20 2 40 -1 M158 220 q40 4 90 -2" stroke-width="0.7"/>

    <!-- PSK box body on top -->
    <path d="M178 176 V194 H256 V176" stroke-width="1.8"/>
    <path d="M180 178 V192 H254" stroke-width="0.9"/>
    <path d="M256 194 L280 182 V166 L256 176" stroke-width="1.6"/>
    <path d="M258 194 L280 183 V168 L258 178 Z" fill="url(#m0101-hatch)" stroke="none"/>
    <!-- box open top face with compartments -->
    <path d="M178 176 L202 164 H280 L256 176 Z" stroke="none" fill="#fff"/>
    <path d="M178 176 L202 164 H280 L256 176 Z" stroke-width="1.6"/>
    <path d="M190 170 L268 170 M184 173 L262 173 M196 167 L274 167" stroke-width="0.7"/>
    <path d="M214 176 L224 164 M232 176 L242 164 M250 176 L260 164" stroke-width="0.7"/>
    <!-- small items in slots -->
    <circle cx="206" cy="171" r="1.6" stroke-width="0.9"/>
    <path d="M226 168 l6 0 M244 170 l5 -2 M262 168 l4 2" stroke-width="1.1"/>
    <circle cx="240" cy="173" r="1.4" stroke-width="0.9"/>
    <!-- lid open ~110 degrees -->
    <path d="M202 164 L212 104 L292 104 L280 166 Z" fill="#fff" stroke="none"/>
    <path d="M202 164 L212 104 L292 104 L280 166" stroke-width="1.8"/>
    <path d="M204 166 L214 106 L290 106" stroke-width="0.9"/>
    <path d="M206 160 L215 110 L286 110 L276 160 Z" fill="url(#m0101-hatch2)" stroke="none"/>
    <path d="M210 108 L200 100 M292 104 L296 98" stroke-width="0.8"/>

    <!-- small brass plaque on stand at right of box -->
    <path d="M292 192 L318 182 L320 176 L294 186 Z" stroke-width="1.3"/>
    <path d="M297 189 l14 -5 M298 186 l12 -5" stroke-width="0.6"/>
    <path d="M296 192 v-4 M316 184 v-4" stroke-width="0.9"/>

    <!-- seven-inch side screen on front face -->
    <path d="M160 204 H200 V226 H160 Z" stroke-width="1.3"/>
    <path d="M162 206 H198 V224 H162 Z" fill="url(#m0101-hatch)" stroke="none"/>

    <!-- visitor on the left reaching toward the box -->
    <circle cx="56" cy="150" r="8" stroke-width="1.5"/>
    <path d="M56 158 V208 M56 170 L80 186 L98 180 M56 172 L38 196 M56 208 L46 256 M56 208 L70 256" stroke-width="1.5"/>
    <path d="M46 256 h-8 M70 256 h8" stroke-width="1.1"/>

    <!-- tiny rope ring posts -->
    <path d="M92 258 v-10 M358 254 v-10" stroke-width="1.1"/>
    <path d="M330 264 q14 -4 30 0" stroke-width="0.8"/>
  </g>
  <text x="386" y="292" text-anchor="end" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="10" fill="#1c1c1c">0101</text>
</svg>

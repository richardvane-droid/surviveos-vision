      <rect fill="url(#pl-site-h02)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="170.2" y="172.7" width="88" height="88.1"/>
      <rect fill="url(#pl-site-h01)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="170.2" y="260.8" width="88" height="38.8"/>
      <rect fill="url(#pl-site-h05)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="170.2" y="299.6" width="88" height="75.1"/>
      <rect fill="url(#pl-site-hn)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="170.2" y="374.7" width="88" height="34.5"/>
      <rect fill="url(#pl-site-hn)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="170.2" y="409.2" width="88" height="103.6"/>
      <rect fill="url(#pl-site-hn)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="20" y="512.8" width="340" height="52.2"/>
      <rect fill="url(#pl-site-h07)" stroke="#3d3d3d" stroke-width="0.5" stroke-opacity="0.6" x="195" y="480.9" width="51.8" height="31.9"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="1.15" stroke-opacity="0.92" x1="170.2" y1="60.5" x2="170.2" y2="299.6"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="1.15" stroke-opacity="0.92" x1="40.7" y1="172.7" x2="258.2" y2="172.7"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="1.15" stroke-opacity="0.92" x1="105" y1="60.5" x2="105" y2="299.6"/>
      <rect fill="none" stroke="#3d3d3d" stroke-width="1.7" stroke-opacity="0.95" x="40.7" y="60.5" width="217.5" height="239.1"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="1.7" stroke-opacity="0.95" x1="170.2" y1="260.8" x2="258.2" y2="260.8"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="0.6" stroke-opacity="0.85" x1="20" y1="527" x2="360" y2="527"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="0.6" stroke-opacity="0.85" x1="20" y1="543" x2="360" y2="543"/>
      <line fill="none" stroke="#3d3d3d" stroke-width="0.6" stroke-opacity="0.85" x1="20" y1="559" x2="360" y2="559"/>
    </g>
    <g>
            <line x1="32" y1="40" x2="32" y2="20" stroke="#3d3d3d" stroke-width="1.2" marker-end="url(#pl-site-arrow)"/>
      <text font-size="10" fill="#555" x="42" y="34">北</text>
      <text font-size="11" fill="#555" x="105" y="125" text-anchor="middle">其他五户</text>
      <text font-size="11" fill="#555" x="105" y="230" text-anchor="middle">不可用</text>
      <text font-size="12.5" font-weight="700" fill="#2a2a2a" x="214" y="212" text-anchor="middle">02 地堡</text>
      <text font-size="12.5" font-weight="700" fill="#2a2a2a" x="214" y="284" text-anchor="middle">01 木屋</text>
      <text font-size="12.5" font-weight="700" fill="#2a2a2a" x="214" y="330" text-anchor="middle">05 庭院</text>
      <text font-size="10.5" font-style="italic" fill="#8a8a8a" x="214" y="346" text-anchor="middle">≈ 22.2㎡</text>
      <text font-size="12.5" font-weight="700" fill="#2a2a2a" x="314" y="196" text-anchor="middle">06 草地</text>
      <text font-size="10.5" font-style="italic" fill="#8a8a8a" x="314" y="212" text-anchor="middle">5.3 × 18.9m</text>
      <text font-size="10.5" font-style="italic" fill="#8a8a8a" x="314" y="228" text-anchor="middle">≈ 100㎡</text>
      <text font-size="11" fill="#555" x="214" y="396" text-anchor="middle">过道 2m</text>
      <text font-size="11" fill="#555" x="214" y="440" text-anchor="middle">缓坡 6m</text>
      <text font-size="12.5" font-weight="700" fill="#2a2a2a" x="221" y="495" text-anchor="middle">07</text>
      <text font-size="11" fill="#2a2a2a" x="221" y="509" text-anchor="middle">钓台</text>
      <text font-size="10.5" font-style="italic" fill="#8a8a8a" x="298" y="500" text-anchor="middle">≈ 5.5㎡</text>
      <text font-size="11" fill="#555" x="88" y="547" text-anchor="middle">河 · 宽 10m</text>
    </g>
  </g>
  <text x="368" y="638" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#5a5a5a">0008-1</text>
</svg>

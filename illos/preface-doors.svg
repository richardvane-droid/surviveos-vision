<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="mpref-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mpref-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- night sky: crescent moon + stars -->
  <g>
    <circle cx="344" cy="52" r="19" fill="#1c1c1c"/>
    <circle cx="352" cy="46" r="18" fill="#f9f6ef"/>
  </g>
  <g fill="#1c1c1c">
    <circle cx="284" cy="18" r="1.1"/><circle cx="302" cy="50" r="0.9"/><circle cx="266" cy="42" r="0.8"/>
    <circle cx="374" cy="76" r="1"/><circle cx="386" cy="34" r="0.8"/><circle cx="26" cy="20" r="0.9"/>
  </g>

  <!-- peach-blossom branch, upper left, drifting petals -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-4 16 Q40 32 66 28 Q86 25 104 42" stroke-width="1.4"/>
    <path d="M40 32 Q46 44 44 56" stroke-width="0.9"/>
    <path d="M70 27 Q76 18 86 18" stroke-width="0.9"/>
  </g>
  <g stroke="#1c1c1c" stroke-width="0.7" fill="#f9f6ef">
    <g transform="translate(66,26)"><circle r="2.6"/><circle cx="3.6" cy="-1" r="2.4"/><circle cx="2.4" cy="3.2" r="2.4"/><circle cx="-2.6" cy="1.6" r="2.3"/><circle cx="-1.2" cy="-3" r="2.3"/></g>
    <g transform="translate(88,18) scale(0.85)"><circle r="2.6"/><circle cx="3.6" cy="-1" r="2.4"/><circle cx="2.4" cy="3.2" r="2.4"/><circle cx="-2.6" cy="1.6" r="2.3"/><circle cx="-1.2" cy="-3" r="2.3"/></g>
    <g transform="translate(46,38) scale(0.7)"><circle r="2.6"/><circle cx="3.6" cy="-1" r="2.4"/><circle cx="2.4" cy="3.2" r="2.4"/><circle cx="-2.6" cy="1.6" r="2.3"/><circle cx="-1.2" cy="-3" r="2.3"/></g>
  </g>
  <g fill="#1c1c1c" opacity="0.8">
    <ellipse cx="128" cy="66" rx="2.4" ry="1.4" transform="rotate(30 128 66)"/>
    <ellipse cx="168" cy="90" rx="2.1" ry="1.2" transform="rotate(-15 168 90)"/>
    <ellipse cx="104" cy="108" rx="2" ry="1.1" transform="rotate(50 104 108)"/>
  </g>

  <!-- three moon-gates, concentric, receding inward like looking down a tunnel of doorways -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="176" r="94" stroke-width="2"/>
    <circle cx="196" cy="176" r="90" stroke-width="0.6"/>
    <circle cx="196" cy="176" r="60" stroke-width="1.6"/>
    <circle cx="196" cy="176" r="56" stroke-width="0.6"/>
  </g>
  <circle cx="196" cy="176" r="30" fill="url(#mpref-hatch)" stroke="#1c1c1c" stroke-width="1.3" filter="url(#mpref-rough)"/>
  <ellipse cx="196" cy="182" rx="16" ry="12" fill="#f9f6ef" stroke="none"/>

  <!-- ground, drawn over the gates' lower rim so they read as standing thresholds -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-4 254 Q100 246 196 250 Q290 246 404 252" stroke-width="4" stroke="#f9f6ef"/>
    <path d="M-4 254 Q100 246 196 250 Q290 246 404 252" stroke-width="1.3"/>
  </g>
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M18 251 q1 -9 3 -9 q2 0 1 9"/>
    <path d="M330 253 q1 -8 3 -8 q2 0 1 8"/>
    <path d="M312 256 q1 -6 2.5 -6 q1.5 0 1 6"/>
  </g>

  <!-- tiny crouched figure with a lamp, knees drawn in like before a jump -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="172" r="3.4" stroke-width="1.1"/>
    <path d="M196 176 Q194 184 188 188 M196 176 Q198 184 204 187 M188 188 Q184 194 186 198 M204 187 Q208 193 205 198" stroke-width="1.2"/>
    <path d="M211 180 q3 -7 8 -3 M217 174 v-5" stroke-width="0.8"/>
  </g>

  <!-- a short trail curling off the crouch, like stored energy about to be spent outward -->
  <path d="M196 172 Q214 156 226 136" fill="none" stroke="#1c1c1c" stroke-width="0.8" stroke-dasharray="1 4" stroke-linecap="round" opacity="0.65"/>

  <text x="382" y="290" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#1c1c1c">序</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="mpref-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mpref-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.8"/>
    </pattern>
  </defs>
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M14 262 Q120 256 200 260 T388 258" stroke-width="1.2"/>
    <!-- gate 1: 院门 (outermost, two posts + lintel, half-open leaf) -->
    <path d="M40 258 V96 M360 258 V96 M32 96 H368" stroke-width="2"/>
    <path d="M43 258 V99 M357 258 V99 M36 100 H364" stroke-width="0.9"/>
    <path d="M40 90 l-8 -10 M360 90 l8 -10 M30 80 H370" stroke-width="1.4"/>
    <path d="M40 106 L112 122 V258 L40 258 Z" stroke-width="1.6"/>
    <path d="M44 110 L108 125 V254 L44 254 Z" fill="url(#mpref-hatch)" stroke="none"/>
    <path d="M52 140 h44 M52 170 h44 M52 200 h44 M52 230 h44" stroke-width="0.7"/>
    <!-- gate 2: 木屋门 (inside, smaller, log wall around) -->
    <path d="M118 258 V140 H282 V258" stroke-width="1.8"/>
    <path d="M121 258 V143 H279" stroke-width="0.8"/>
    <path d="M110 140 L200 112 L290 140" stroke-width="1.8"/>
    <path d="M121 156 H279 M121 172 H279 M121 188 H279 M121 204 H279 M121 220 H279 M121 236 H279" stroke-width="0.7"/>
    <path d="M160 258 V176 H240 V258" stroke-width="1.6"/>
    <path d="M163 258 V179 H237 V258" fill="#f9f6ef" stroke="none"/>
    <path d="M163 258 V179 H237" stroke-width="0.9"/>
    <path d="M232 218 a2 2 0 1 0 0.1 0" stroke-width="1"/>
    <!-- gate 3: 藏宝阁门 (innermost, tent-shaped, dark inside, small light) -->
    <path d="M200 194 L172 258 H228 Z" stroke-width="1.6"/>
    <path d="M200 198 L176 254 H224 Z" fill="url(#mpref-hatch)" stroke="none"/>
    <path d="M190 258 V226 L200 214 L210 226 V258" stroke-width="1.3"/>
    <path d="M192 256 V228 L200 218 L208 228 V256" fill="#f9f6ef" stroke="none"/>
    <!-- tiny figure inside with a lamp -->
    <circle cx="200" cy="236" r="3.2" stroke-width="1.1"/>
    <path d="M200 239 V249 M200 243 L196 247 M200 243 L204 246 M200 249 L197 255 M200 249 L203 255" stroke-width="1.1"/>
    <path d="M206 232 q4 -6 8 0 M210 226 v-4" stroke-width="0.8"/>
    <!-- path leading in -->
    <path d="M60 262 Q140 262 176 258" stroke-width="0.9" stroke-dasharray="3 4"/>
    <!-- grass -->
    <path d="M300 256 l2 -7 l2 7 M312 257 l2 -6 M24 255 l2 -7 l2 7" stroke-width="0.9"/>
  </g>
  <g stroke="#1c1c1c" stroke-width="1" fill="#f9f6ef">
    <circle cx="76" cy="90" r="7"/><circle cx="148" cy="130" r="7"/><circle cx="236" cy="206" r="7"/>
  </g>
  <g font-family="'Noto Sans SC','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="9" fill="#1c1c1c" text-anchor="middle">
    <text x="76" y="93">1</text><text x="148" y="133">2</text><text x="236" y="209">3</text>
  </g>
  <g font-family="'Long Cang','Kaiti SC',cursive" font-size="12" fill="#5a5a5a">
    <text x="18" y="30">三道门：1 院门　2 木屋门　3 藏宝阁门</text>
    <text x="18" y="48">人藏在最里面，遥控指挥天下大事</text>
  </g>
  <text x="386" y="292" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="10" fill="#1c1c1c">序</text>
</svg>

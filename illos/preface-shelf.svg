<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="mpref-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mpref-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.7"/>
    </pattern>
    <pattern id="mpref-hatch2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#1c1c1c" stroke-width="0.45" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- wall behind the shelf, faint hatch, and a warm wash-light glow licking down from the top -->
  <rect x="18" y="40" width="364" height="176" fill="url(#mpref-hatch2)" opacity="0.5"/>
  <ellipse cx="210" cy="70" rx="150" ry="46" fill="#f9f6ef" opacity="0.9"/>

  <!-- the shelf itself: one shallow board, spines flush, built into the wall -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 214 H380" stroke-width="2"/>
    <path d="M20 214 L10 224 H392 L380 214" stroke-width="1.6"/>
    <path d="M10 224 V232 H392 V224" stroke-width="1.4"/>
    <path d="M20 214 V206 M380 214 V206" stroke-width="1.2"/>
  </g>

  <!-- tin box at the far left end of the shelf -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 214 V182 H62 V214" stroke-width="1.5"/>
    <path d="M28 182 L34 175 H68 L62 182 Z" stroke-width="1.3"/>
    <path d="M46 182 V175" stroke-width="1"/>
    <path d="M44 196 h4 v6 h-4 Z" stroke-width="0.9"/>
  </g>
  <path d="M33 213 V185 H59 V213 Z" fill="url(#mpref-hatch)" opacity="0.5"/>

  <!-- four books standing spine-out, titles from 0209's poster-wall reading list -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 214 V96 H150 V214" stroke-width="1.6"/>
    <path d="M154 214 V80 H188 V214" stroke-width="1.6"/>
    <g transform="rotate(-4 210 214)">
      <path d="M194 214 V108 H228 V214" stroke-width="1.6"/>
    </g>
    <path d="M232 214 V88 H266 V214" stroke-width="1.6"/>
  </g>
  <g fill="url(#mpref-hatch)" opacity="0.55">
    <path d="M121 211 V99 H147 V211 Z"/>
    <path d="M157 211 V83 H185 V211 Z"/>
    <path d="M235 211 V91 H263 V211 Z"/>
  </g>

  <!-- vertical book-spine titles, one character per line, top to bottom -->
  <g font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#1c1c1c" text-anchor="middle">
    <text x="134" y="112">归</text><text x="134" y="128">园</text><text x="134" y="144">田</text><text x="134" y="160">居</text>
    <text x="171" y="98">陶</text><text x="171" y="114">庵</text><text x="171" y="130">梦</text><text x="171" y="146">忆</text>
    <g transform="rotate(-4 210 214)">
      <text x="211" y="124">闲</text><text x="211" y="140">情</text><text x="211" y="156">偶</text><text x="211" y="172">寄</text>
    </g>
    <text x="249" y="104">浮</text><text x="249" y="120">生</text><text x="249" y="136">六</text><text x="249" y="152">记</text>
  </g>

  <!-- a small ceramic-and-silver tea set at the far right end -->
  <g filter="url(#mpref-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 214 V206 Q300 198 310 198 Q320 198 320 206 V214" stroke-width="1.3"/>
    <path d="M320 202 q8 0 8 6 q0 5 -7 6" stroke-width="1"/>
    <path d="M296 214 H324" stroke-width="1"/>
    <path d="M336 214 V196 Q336 188 344 188 Q352 188 352 196 V214" stroke-width="1.4"/>
    <path d="M336 196 H352" stroke-width="0.9"/>
    <path d="M340 188 q4 -6 8 0" stroke-width="0.9"/>
  </g>

  <!-- a thin LED wash-light strip along the top edge, and a couple of dust motes in the light -->
  <path d="M96 42 H324" stroke="#1c1c1c" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <g fill="#1c1c1c" opacity="0.5">
    <circle cx="160" cy="56" r="0.9"/><circle cx="230" cy="46" r="0.8"/><circle cx="280" cy="60" r="0.9"/>
  </g>

  <text x="382" y="290" text-anchor="end" font-family="'Long Cang','Kaiti SC',cursive" font-size="11" fill="#1c1c1c">序</text>
</svg>

    <path d="M65 121 H137 V167" stroke-width="0.9"/>
    <path d="M68 126 h20 M68 132 h14" stroke-width="1.2"/>
    <path d="M108 126 h26 M108 132 h18" stroke-width="1.2"/>
    <path d="M68 164 H134 M68 142 V164" stroke-width="0.8"/>

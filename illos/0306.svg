    <path d="M176 99 L236 125 L228 143 L168 117 Z" stroke-width="1.7"/>
    <path d="M179 102 L233 126" stroke-width="0.9"/>
    <path d="M180 103 L232 127 L226 140 L172 116 Z" fill="url(#m0306-hatch2)" stroke="none"/>
    <path d="M206 112 L200 126" stroke-width="1"/>


    <path d="M170 186 q10 -3 20 0 t20 0 t20 0" stroke-width="0.8"/>
    <path d="M186 178 h24 l-4 6 h-16 Z M198 178 V166" stroke-width="1"/>
    <path d="M198 166 l10 8 h-10" stroke-width="0.8"/>

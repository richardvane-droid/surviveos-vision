    <path d="M96 108 H162 V152 H96 Z M167 108 H233 V152 H167 Z M238 108 H304 V152 H238 Z" stroke-width="1.2"/>
    <path d="M96 156 H162 V198 H96 Z M167 156 H233 V198 H167 Z M238 156 H304 V198 H238 Z" stroke-width="1.2"/>


    <circle cx="238" cy="182" r="2.2" stroke-width="1"/>
    <circle cx="248" cy="182" r="2.2" stroke-width="1"/>
    <circle cx="258" cy="182" r="2.2" stroke-width="1"/>
    <circle cx="268" cy="182" r="2.2" stroke-width="1"/>
    <!-- sockets -->
    <path d="M234 194 h40 v18 h-40 Z" stroke-width="1.2"/>
    <circle cx="244" cy="203" r="4" stroke-width="0.9"/>
    <circle cx="264" cy="203" r="4" stroke-width="0.9"/>

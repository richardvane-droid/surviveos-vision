    <path d="M196 84 V104 L330 156 V176 H314" stroke-width="1.1"/>
    <path d="M296 192 V230 H290" stroke-width="1.1"/>

    <!-- ammeter on knee wall -->
    <circle cx="296" cy="176" r="16" stroke-width="1.6"/>
    <circle cx="296" cy="176" r="13" stroke-width="0.8"/>
    <path d="M286 170 q10 -8 20 0" stroke-width="0.9"/>
    <path d="M296 182 L303 168" stroke-width="1.3"/>
    <circle cx="296" cy="182" r="1.6" stroke-width="1"/>
    <path d="M288 188 h16" stroke-width="0.8"/>


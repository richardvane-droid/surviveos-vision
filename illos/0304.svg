<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="m0304-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="m0304-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.8"/>
    </pattern>
    <pattern id="m0304-hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1c1c" stroke-width="0.8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1c1c1c" stroke-width="0.6"/>
    </pattern>
  </defs>
  <g filter="url(#m0304-rough)" stroke="#1c1c1c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor -->
    <path d="M14 246 Q120 243 200 246 T388 244" stroke-width="1.2"/>
    <path d="M30 252 q30 -3 60 0" stroke-width="0.8"/>

    <!-- roof section: slope descends to the right, knee wall at right -->
    <path d="M14 30 L340 150" stroke-width="2"/>
    <path d="M14 20 L346 142" stroke-width="1.6"/>
    <path d="M16 33 L338 152" stroke-width="0.9"/>

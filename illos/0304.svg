    <path d="M222 224 h52 M222 230 h52 M222 236 h52" stroke-width="0.8"/>
    <!-- side shading -->
    <path d="M152 226 H214 V242 H152 Z" fill="url(#m0304-hatch)" stroke="none"/>

    <!-- wooden rack with two spare batteries, left -->
    <path d="M40 246 V150 M48 246 V150 M120 246 V150 M128 246 V150" stroke-width="1.5"/>
    <path d="M42 152 V244" stroke-width="0.7"/>
    <path d="M36 150 H132 M36 200 H132 M36 244 H132" stroke-width="1.6"/>
    <path d="M38 154 H130 M38 204 H130" stroke-width="0.8"/>
    <!-- battery blocks -->
    <path d="M54 196 V166 H114 V196" stroke-width="1.6"/>
    <path d="M56 168 H112" stroke-width="0.8"/>
    <path d="M62 166 v-6 h8 v6 M98 166 v-6 h8 v6" stroke-width="1.2"/>
    <path d="M60 178 h18 M60 184 h10" stroke-width="0.9"/>
    <path d="M90 172 L114 172 V196 L90 196 Z" fill="url(#m0304-hatch)" stroke="none"/>
    <path d="M54 240 V210 H114 V240" stroke-width="1.6"/>
    <path d="M56 212 H112" stroke-width="0.8"/>
    <path d="M62 210 v-6 h8 v6 M98 210 v-6 h8 v6" stroke-width="1.2"/>
    <path d="M60 222 h18 M60 228 h10" stroke-width="0.9"/>
    <path d="M90 216 L114 216 V240 L90 240 Z" fill="url(#m0304-hatch)" stroke="none"/>
    <!-- velcro straps -->
    <path d="M84 166 V196 M84 210 V240" stroke-width="1.4"/>

    <!-- fire extinguisher by the wall -->
    <path d="M312 246 v-28 q0 -8 8 -8 q8 0 8 8 v28 Z" stroke-width="1.4"/>
    <path d="M318 210 v-6 h4 v6 M320 204 l-6 -2" stroke-width="1"/>
    <path d="M314 226 h12" stroke-width="0.8"/>
    <path d="M320 216 v28" stroke-width="0.6"/>
  </g>
  <text x="386" y="292" text-anchor="end" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="10" fill="#1c1c1c">0304</text>

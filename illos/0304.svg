    <path d="M60 47 l-3 10 M130 73 l-3 10 M200 99 l-3 10 M270 124 l-3 10" stroke-width="1"/>
    <path d="M36 44 L322 150" stroke-width="0.7"/>

    <!-- PV panel outside on the roof (upper right, cut by canvas) -->
    <path d="M180 75 L340 134 L357 87 L197 28 Z" stroke-width="1.9"/>
    <path d="M183 74 L199 31 L355 89" stroke-width="0.9"/>
    <!-- panel cell grid -->
    <path d="M186 59 L346 118 M191 44 L351 103" stroke-width="0.8"/>
    <path d="M212 87 L229 40 M244 98 L261 51 M276 110 L293 63 M308 122 L325 75" stroke-width="0.8"/>
    <!-- mounting brackets -->
    <path d="M200 82 V89 M270 108 V115 M330 130 V137" stroke-width="1.3"/>

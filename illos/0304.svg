    <path d="M162 176 H222 V204 H162 Z" stroke-width="1.4"/>
    <path d="M166 180 H218 V200 H166 Z" fill="url(#m0304-hatch2)" stroke="none"/>
    <path d="M170 186 h10 v10 h-10 Z M172 188 v6 h6 v-6 Z" stroke-width="0.9" fill="#fff"/>
